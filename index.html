<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Fight Archive — Character Builder</title>
<meta name="description" content="Build, save, and export D&D 5e character sheets. Nothing leaves your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral+SC:wght@600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Core Color Palette */
    --void:#0B0C10;          /* Primary Background / Text Contrast (Rich Black) */
    --panel:#13151c;        /* Dark Surface Panel */
    --panel-2:#1a1d27;      /* Secondary Dark Surface */
    --raised:#232734;       /* Hover / Raised Surface */
    --line:#2e3344;         /* Border lines */
    --line-soft:#1f2330;
    
    --ink:#FFFFFF;          /* Primary Typography (Pure White) */
    --ink-dim:#EAEAEA;      /* Secondary Typography (Off-White / Light Gray) */
    --ink-faint:#a0a5b5;    /* Muted subtext / labels */
    
    --crimson:#8B0000;      /* Secondary Background / Accents (Deep Crimson) */
    --crimson-bright:#a60000;
    
    --blue:#4169E1;         /* Secondary Background / Links / UI (Royal Blue) */
    --blue-bright:#5a7fe6;
    
    --hp-green:#5c7a4f;
    --danger:#8B0000;
    --font-display:'Spectral', serif;
    --font-display-sc:'Spectral SC', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
  }
  ::selection{background:var(--crimson); color:#fff;}
  a{color:var(--blue);}
  a:hover{color:var(--blue-bright);}
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0 0 .4em; color:var(--ink);}
  button{font-family:var(--font-body); cursor:pointer;}
  input,select,textarea{font-family:var(--font-body); color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius); padding:.5em .65em; font-size:.95rem;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--blue);}
  label{display:block; font-size:.72rem; letter-spacing:.02em; color:var(--ink-faint); margin-bottom:.3em; text-transform:none;}
  .field{margin-bottom:1rem;}
  .hint{font-size:.78rem; color:var(--ink-faint); margin-top:.3em;}

  /* ---------- App shell ---------- */
  #app{display:flex; min-height:100vh;}
  .rail{
    width:230px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .rail-brand{
    padding:1.1rem 1.1rem .9rem; border-bottom:1px solid var(--line);
    background:var(--void);
  }
  .rail-brand .mark{font-family:var(--font-display-sc); font-size:.92rem; letter-spacing:.04em; color:var(--blue-bright);}
  .rail-brand .sub{font-size:.72rem; color:var(--ink-faint); margin-top:.2rem;}
  .rail-section{padding:.9rem 1.1rem .3rem; font-size:.68rem; color:var(--ink-faint); letter-spacing:.04em;}
  .char-list{padding:0 .6rem;}
  .char-item{
    display:flex; align-items:center; justify-content:space-between; gap:.4rem;
    padding:.55rem .6rem; border-radius:var(--radius); cursor:pointer; margin-bottom:.15rem;
    border:1px solid transparent;
  }
  .char-item:hover{background:var(--raised);}
  .char-item.active{background:var(--panel-2); border-color:var(--blue);}
  .char-item .nm{font-size:.85rem; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .char-item .meta{font-size:.68rem; color:var(--ink-faint);}
  .char-item .del{opacity:0; background:none; border:none; color:var(--ink-faint); font-size:.9rem; padding:.1rem .3rem;}
  .char-item:hover .del{opacity:1;}
  .char-item .del:hover{color:var(--crimson-bright);}
  .new-char-btn{
    margin:.4rem .6rem 1rem; padding:.55rem .6rem; text-align:left;
    background:none; border:1px dashed var(--line); border-radius:var(--radius);
    color:var(--ink-dim); font-size:.85rem; width:calc(100% - 1.2rem);
  }
  .new-char-btn:hover{border-color:var(--blue); color:var(--blue-bright);}

  .steps{padding:0 .6rem; margin-top:auto; border-top:1px solid var(--line); padding-top:.7rem; padding-bottom:.8rem;}
  .step-btn{
    display:flex; align-items:center; gap:.55rem; width:100%; text-align:left;
    background:none; border:none; color:var(--ink-faint); padding:.5rem .6rem;
    border-radius:var(--radius); font-size:.85rem;
  }
  .step-btn .num{
    font-family:var(--font-mono); font-size:.68rem; width:1.3rem; height:1.3rem;
    border:1px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .step-btn.active{color:var(--ink); background:var(--panel-2);}
  .step-btn.active .num{border-color:var(--blue); color:var(--blue-bright);}
  .step-btn.done .num{border-color:var(--crimson); color:var(--crimson-bright);}
  .step-btn:hover{color:var(--ink);}

  main{flex:1; min-width:0; padding:2.4rem 3rem 5rem; max-width:980px;}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:1.6rem; flex-wrap:wrap; gap:.6rem;}
  .topbar h1{font-size:1.5rem; margin:0;}
  .topbar .status{font-size:.72rem; color:var(--ink-faint); font-family:var(--font-mono);}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:1.6rem 1.8rem; margin-bottom:1.4rem;}
  .panel h2{font-size:1.15rem; border-bottom:1px solid var(--line); padding-bottom:.55rem; margin-bottom:1.1rem;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:1rem 1.4rem;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:1rem 1.4rem;}
  @media (max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  .btn{
    background:var(--crimson); color:var(--ink); border:none; padding:.6rem 1.1rem;
    border-radius:var(--radius); font-size:.88rem; font-weight:600; letter-spacing:.01em;
  }
  .btn:hover{background:var(--crimson-bright);}
  .btn:disabled{background:var(--line); color:var(--ink-faint); cursor:not-allowed;}
  .btn.secondary{background:none; border:1px solid var(--line); color:var(--ink-dim);}
  .btn.secondary:hover{border-color:var(--blue); color:var(--ink);}
  .btn.ghost{background:none; border:none; color:var(--ink-faint); padding:.4rem .6rem;}
  .btn.ghost:hover{color:var(--ink);}
  .btn-row{display:flex; gap:.6rem; margin-top:1.5rem; flex-wrap:wrap;}
  .btn-row.split{justify-content:space-between;}

  .card{
    border:1px solid var(--line); border-radius:var(--radius); padding:.9rem 1rem; cursor:pointer;
    background:var(--panel-2); transition:border-color .1s;
  }
  .card:hover{border-color:var(--ink-faint);}
  .card.selected{border-color:var(--blue); background:#141a29;}
  .card h3{font-size:.98rem; margin-bottom:.25rem; color:var(--ink);}
  .card p{font-size:.8rem; color:var(--ink-dim); margin:0; line-height:1.45;}
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:.7rem;}

  .pill{display:inline-block; font-size:.68rem; padding:.15rem .5rem; border:1px solid var(--line); border-radius:20px; color:var(--ink-faint); margin-right:.3rem;}

  .search{width:100%; margin-bottom:1rem;}

  .loader{display:flex; align-items:center; gap:.6rem; color:var(--ink-faint); font-size:.85rem; padding:1rem 0;}
  .spinner{width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .error-box{border:1px solid var(--crimson); background:#200808; color:#f0a8a8; padding:.9rem 1rem; border-radius:var(--radius); font-size:.85rem; margin-bottom:1rem;}

  .toast{position:fixed; bottom:1.4rem; left:50%; transform:translateX(-50%); background:var(--raised); border:1px solid var(--blue); color:var(--ink); padding:.6rem 1.1rem; border-radius:var(--radius); font-size:.85rem; z-index:999; box-shadow:0 6px 24px rgba(0,0,0,.6); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .ability-box{border:1px solid var(--line); border-radius:var(--radius); padding:.8rem; text-align:center; background:var(--panel-2);}
  .ability-box .lbl{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.08em; color:var(--ink-faint);}
  .ability-box input{width:70px; text-align:center; font-size:1.3rem; font-family:var(--font-display); margin:.35rem 0 .2rem;}
  .ability-box .mod{font-size:.78rem; color:var(--blue-bright); font-family:var(--font-mono);}
  .pool-readout{font-family:var(--font-mono); font-size:.85rem; color:var(--ink-dim); margin-bottom:1rem;}
  .method-tabs{display:flex; gap:.5rem; margin-bottom:1.2rem;}
  .method-tabs button{flex:1;}

  table.sheet-table{width:100%; border-collapse:collapse; font-size:.85rem;}
  table.sheet-table th, table.sheet-table td{text-align:left; padding:.4rem .3rem; border-bottom:1px solid var(--line-soft);}
  table.sheet-table th{color:var(--ink-faint); font-weight:500; font-size:.72rem;}

  .skill-row{display:flex; align-items:center; gap:.55rem; padding:.35rem 0; border-bottom:1px solid var(--line-soft); font-size:.85rem;}
  .skill-row input[type=checkbox]{accent-color:var(--blue);}
  .skill-row .sname{flex:1; color:var(--ink-dim);}
  .skill-row .sability{font-family:var(--font-mono); font-size:.68rem; color:var(--ink-faint); width:2.2rem;}
  .skill-row .smod{font-family:var(--font-mono); width:2.6rem; text-align:right; color:var(--ink);}

  .equip-row{display:flex; align-items:center; gap:.6rem; padding:.4rem 0; border-bottom:1px solid var(--line-soft);}
  .equip-row .en{flex:1; font-size:.87rem; color:var(--ink-dim);}
  .equip-row input[type=number]{width:56px;}

  .chip-list{display:flex; flex-wrap:wrap; gap:.4rem;}
  .chip{background:var(--panel-2); border:1px solid var(--line); border-radius:20px; padding:.25rem .7rem; font-size:.78rem; display:flex; align-items:center; gap:.4rem; color:var(--ink-dim);}
  .chip button{background:none; border:none; color:var(--ink-faint); font-size:.85rem; padding:0;}
  .chip button:hover{color:var(--crimson-bright);}

  /* ---------------- Character sheet (Export / Print view) ---------------- */
  .sheet{
    background:#EAEAEA; color:#0B0C10; border-radius:2px; padding:2.2rem 2.4rem;
    font-family:var(--font-body);
  }
  .sheet *{color:#0B0C10;}
  .sheet .sheet-head{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #8B0000; padding-bottom:.7rem; margin-bottom:1.2rem;}
  .sheet .sheet-head h2{font-family:var(--font-display); font-size:1.9rem; margin:0; color:#0B0C10;}
  .sheet .sheet-head .sub{font-size:.82rem; color:#4169E1;}
  .sheet-grid{display:grid; grid-template-columns:1.1fr 1fr 1.3fr; gap:1.4rem;}
  @media (max-width:900px){.sheet-grid{grid-template-columns:1fr;}}
  .sheet-block{margin-bottom:1.1rem;}
  .sheet-block h4{font-family:var(--font-display-sc); font-size:.78rem; letter-spacing:.06em; border-bottom:1px solid #353b4e; padding-bottom:.3rem; margin-bottom:.5rem; color:#8B0000;}
  .statline{display:flex; justify-content:space-between; font-size:.86rem; padding:.15rem 0;}
  .abil-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem;}
  .abil-cell{border:1px solid #353b4e; border-radius:4px; text-align:center; padding:.45rem 0; background:#ffffff;}
  .abil-cell .an{font-size:.65rem; letter-spacing:.08em; color:#4169E1;}
  .abil-cell .av{font-family:var(--font-display); font-size:1.15rem; color:#0B0C10;}
  .abil-cell .am{font-size:.7rem; color:#8B0000;}
  .sheet-hp{display:flex; gap:.8rem;}
  .sheet-hp .hb{flex:1; border:1px solid #353b4e; border-radius:4px; text-align:center; padding:.5rem 0; background:#ffffff;}
  .sheet-hp .hb .n{font-family:var(--font-display); font-size:1.3rem; color:#0B0C10;}
  .sheet-hp .hb .l{font-size:.65rem; color:#4169E1;}
  .sheet ul{margin:.2rem 0; padding-left:1.1rem; font-size:.85rem;}
  .sheet .prose{font-size:.85rem; white-space:pre-wrap;}

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute; top:0; left:0; width:100%; margin:0; padding:0;}
    .sheet{box-shadow:none; border-radius:0;}
  }
  #print-area{display:none;}

  .empty-state{text-align:center; padding:4rem 1rem; color:var(--ink-faint);}
  .empty-state h2{color:var(--ink-dim);}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--void);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
</style>
</head>
<body>

<div id="app"></div>
<div id="print-area"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   BOSS FIGHT ARCHIVE — CHARACTER BUILDER
   Single-file static app. No build step, no server. Deploy: GitHub Pages.
   ========================================================================= */

const CONTENT_BASE = "https://www.dnd5eapi.co/api/2014"; 
const CACHE_KEY = "bfa_content_cache_v1";
const CACHE_TTL_MS = 1000 * 60 * 60 * 12; // 12h
const STORE_KEY = "bfa_characters_v1";
const SOURCES_KEY = "bfa_homebrew_sources_v1"; 

function loadHomebrewSources(){
  try{ return JSON.parse(localStorage.getItem(SOURCES_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveHomebrewSources(list){ localStorage.setItem(SOURCES_KEY, JSON.stringify(list)); }

const UPLOADS_KEY = "bfa_uploaded_homebrew_v1"; 
function loadUploadedFiles(){
  try{ return JSON.parse(localStorage.getItem(UPLOADS_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveUploadedFiles(list){
  try{ localStorage.setItem(UPLOADS_KEY, JSON.stringify(list)); return true; }
  catch(e){ showToast("Couldn't save that file — it may be too large for browser storage."); return false; }
}
function addUploadedFile(name, xmlText){
  parseHomebrewXml(xmlText, name); // throws if malformed
  const list = loadUploadedFiles();
  const existingIdx = list.findIndex(f=>f.name===name);
  const entry = {name, xml:xmlText, addedAt:Date.now()};
  if(existingIdx>=0) list[existingIdx] = entry; else list.push(entry);
  return saveUploadedFiles(list);
}
function removeUploadedFile(name){
  saveUploadedFiles(loadUploadedFiles().filter(f=>f.name!==name));
}
function removeUploadedFiles(names){
  const set = new Set(names);
  saveUploadedFiles(loadUploadedFiles().filter(f=>!set.has(f.name)));
}

let homebrewCache = { races:[], classes:[], backgrounds:[], spells:[], equipment:[], features:[], loadedAt:0 };

function slug(s){ return (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

/* ---------------------------------------------------------------------
   HOMEBREW CONTENT PARSER
   Supports both Aurora Builder (<elements><element ...>) and custom XML formats.
   --------------------------------------------------------------------- */
function parseHomebrewXml(xmlText, sourceUrl){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('Malformed homebrew XML');
  const out = { races:[], classes:[], backgrounds:[], spells:[], equipment:[], features:[] };

  // 1. Support Aurora Elements schema (<elements><element ...>)
  const auroraElements = doc.querySelectorAll('element');
  if(auroraElements.length > 0) {
    auroraElements.forEach(el => {
      const type = (el.getAttribute('type') || '').toLowerCase();
      const name = el.getAttribute('name') || '';
      if(!name) return;

      const source = el.getAttribute('source') || sourceUrl;
      const index = 'hb-' + slug(name);
      const descEl = el.querySelector('description');
      const description = descEl ? descEl.textContent.trim() : '';

      if (type === 'background') {
        const skills = [];
        el.querySelectorAll('grant[type="Proficiency"]').forEach(g => {
          const id = g.getAttribute('id') || '';
          if (id.includes('SKILL_')) {
            let sk = id.replace(/.*SKILL_/, '').toLowerCase();
            const skillMap = {
              'sleightofhand': 'sleight-of-hand',
              'animalhandling': 'animal-handling'
            };
            skills.push(skillMap[sk] || sk);
          }
        });
        out.backgrounds.push({
          index,
          name,
          homebrew: true,
          source,
          skills,
          description
        });
      } else if (type === 'race' || type === 'sub race' || type === 'subrace') {
        const speed = parseInt(el.querySelector('stat[name="speed"]')?.getAttribute('value')) || 30;
        const size = el.querySelector('stat[name="size"]')?.getAttribute('value') || 'Medium';
        const ability_bonuses = [];
        el.querySelectorAll('stat').forEach(st => {
          const n = (st.getAttribute('name') || '').toLowerCase();
          if (['strength', 'dexterity', 'constitution', 'intelligence', 'wisdom', 'charisma'].includes(n)) {
            const val = parseInt(st.getAttribute('value')) || 0;
            if (val > 0) {
              ability_bonuses.push({
                ability_score: { index: n.slice(0, 3) },
                bonus: val
              });
            }
          }
        });
        out.races.push({
          index,
          name,
          homebrew: true,
          source,
          speed,
          size,
          ability_bonuses,
          traits: [{ name, description }],
          languages: [],
          subraces: []
        });
      } else if (type === 'class') {
        let hit_die = 8;
        const hdStat = el.querySelector('stat[name="hit die"]');
        if (hdStat) hit_die = parseInt(hdStat.getAttribute('value')) || 8;
        
        const saving_throws = [];
        el.querySelectorAll('grant[type="Proficiency"]').forEach(g => {
          const id = (g.getAttribute('id') || '').toLowerCase();
          if (id.includes('savingthrow')) {
            const abil = id.replace(/.*savingthrow_?/, '').slice(0, 3);
            if (abil) saving_throws.push({ index: abil, name: abil.toUpperCase() });
          }
        });

        out.classes.push({
          index,
          name,
          homebrew: true,
          source,
          hit_die,
          saving_throws,
          proficiency_choices: [],
          spellcasting: !!el.querySelector('spellcasting')
        });
      } else if (type === 'spell') {
        const levelStr = el.querySelector('set[name="level"]')?.textContent || '0';
        const school = el.querySelector('set[name="school"]')?.textContent || '';
        const klass = el.querySelector('set[name="class"], set[name="spellcastingClass"]')?.textContent || '';
        out.spells.push({
          index,
          name,
          homebrew: true,
          source,
          level: parseInt(levelStr) || 0,
          school,
          klass,
          description
        });
      } else if (['item', 'equipment', 'magic item', 'weapon', 'armor'].includes(type)) {
        const category = el.querySelector('set[name="category"]')?.textContent || type;
        const cost = el.querySelector('set[name="cost"]')?.textContent || '';
        out.equipment.push({
          index,
          name,
          homebrew: true,
          source,
          category,
          cost,
          description
        });
      } else {
        out.features.push({
          index,
          name,
          type: el.getAttribute('type'),
          source,
          description
        });
      }
    });
  }

  // 2. Custom <content> schema parser fallback
  doc.querySelectorAll('content > race').forEach(el=>{
    out.races.push({
      index: 'hb-' + slug(el.getAttribute('name')),
      name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      speed: parseInt(el.querySelector('speed')?.textContent)||30,
      size: el.querySelector('size')?.textContent || 'Medium',
      ability_bonuses: Array.from(el.querySelectorAll('ability_bonus')).map(b=>({ability_score:{index:b.getAttribute('ability')}, bonus:parseInt(b.getAttribute('value'))})),
      traits: Array.from(el.querySelectorAll('trait')).map(t=>({name:t.getAttribute('name'), description:t.querySelector('description')?.textContent||''})),
      languages: Array.from(el.querySelectorAll('language')).map(l=>({name:l.textContent})),
      subraces: [],
    });
  });

  doc.querySelectorAll('content > class').forEach(el=>{
    out.classes.push({
      index: 'hb-' + slug(el.getAttribute('name')),
      name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      hit_die: parseInt(el.getAttribute('hit_die'))||8,
      saving_throws: Array.from(el.querySelectorAll('saving_throw')).map(s=>({index:s.getAttribute('ability'), name:s.getAttribute('ability').toUpperCase()})),
      proficiency_choices: (()=>{
        const sc = el.querySelector('skill_choice');
        if(!sc) return [];
        return [{ choose: parseInt(sc.getAttribute('count'))||2, from:{ options: Array.from(sc.querySelectorAll('option')).map(o=>({item:{index:'skill-'+o.getAttribute('skill')}})) } }];
      })(),
      spellcasting: !!el.querySelector('spellcasting'),
    });
  });

  doc.querySelectorAll('content > background').forEach(el=>{
    out.backgrounds.push({
      index: 'hb-' + slug(el.getAttribute('name')),
      name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      skills: Array.from(el.querySelectorAll('skill_proficiency')).map(s=>s.getAttribute('skill')),
    });
  });

  doc.querySelectorAll('content > spell').forEach(el=>{
    out.spells.push({
      index: 'hb-' + slug(el.getAttribute('name')),
      name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      level: parseInt(el.getAttribute('level'))||0,
      school: el.getAttribute('school')||'',
      klass: el.getAttribute('class')||'',
      description: el.querySelector('description')?.textContent||'',
    });
  });

  doc.querySelectorAll('content > equipment').forEach(el=>{
    out.equipment.push({
      index: 'hb-' + slug(el.getAttribute('name')),
      name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      category: el.getAttribute('category')||'',
      cost: el.querySelector('cost')?.textContent||'',
    });
  });

  return out;
}

async function loadAllHomebrew(force){
  const sources = loadHomebrewSources();
  const uploads = loadUploadedFiles();
  if(!sources.length && !uploads.length){ homebrewCache = { races:[], classes:[], backgrounds:[], spells:[], equipment:[], features:[], loadedAt:Date.now() }; return homebrewCache; }
  if(!force && Date.now() - homebrewCache.loadedAt < CACHE_TTL_MS && homebrewCache.loadedAt) return homebrewCache;
  const merged = { races:[], classes:[], backgrounds:[], spells:[], equipment:[], features:[] };

  for(const file of uploads){
    try{
      const parsed = parseHomebrewXml(file.xml, file.name);
      Object.keys(merged).forEach(k=>merged[k].push(...(parsed[k]||[])));
    }catch(err){
      console.warn('Uploaded file failed to parse:', file.name, err);
      state.errors['hb:'+file.name] = err.message;
    }
  }

  for(const url of sources){
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      const parsed = parseHomebrewXml(text, url);
      Object.keys(merged).forEach(k=>merged[k].push(...(parsed[k]||[])));
    }catch(err){
      console.warn('Homebrew source failed:', url, err);
      state.errors['hb:'+url] = err.message;
    }
  }
  homebrewCache = { ...merged, loadedAt: Date.now() };
  return homebrewCache;
}

const SKILLS = [
  ["acrobatics","dex"],["animal-handling","wis"],["arcana","int"],["athletics","str"],
  ["deception","cha"],["history","int"],["insight","wis"],["intimidation","cha"],
  ["investigation","int"],["medicine","wis"],["nature","int"],["perception","wis"],
  ["performance","cha"],["persuasion","cha"],["religion","int"],["sleight-of-hand","dex"],
  ["stealth","dex"],["survival","wis"]
];
const ABILS = ["str","dex","con","int","wis","cha"];
const ABIL_NAMES = {str:"Strength",dex:"Dexterity",con:"Constitution",int:"Intelligence",wis:"Wisdom",cha:"Charisma"};

const STEPS = [
  {id:"identity", label:"Identity"},
  {id:"race", label:"Race"},
  {id:"class", label:"Class"},
  {id:"abilities", label:"Ability Scores"},
  {id:"background", label:"Background & Skills"},
  {id:"equipment", label:"Equipment"},
  {id:"spells", label:"Spells"},
  {id:"sheet", label:"Character Sheet"},
];

/* --------------------------- state store --------------------------- */
const state = {
  characters: [],
  activeId: null,
  step: "identity",
  cache: {},
  loading: {},
  errors: {},
  showSettings: false,
};

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadCharacters(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    state.characters = raw ? JSON.parse(raw) : [];
  }catch(e){ state.characters = []; }
}
function persistCharacters(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state.characters));
}
function activeChar(){
  return state.characters.find(c => c.id === state.activeId) || null;
}
function touch(c){ c.updatedAt = Date.now(); persistCharacters(); }

function newCharacter(name){
  const c = {
    id: uid(),
    name: name || "Unnamed Adventurer",
    createdAt: Date.now(), updatedAt: Date.now(),
    playerName:"", alignment:"", level:1, xp:0,
    raceIndex:null, subraceIndex:null,
    classIndex:null,
    backgroundIndex:null, backgroundCustom:"",
    abilityMethod:"standard",
    abilityScores:{str:10,dex:10,con:10,int:10,wis:10,cha:10},
    skillProfs:[],
    languages:[],
    equipment:[], 
    equipmentNotes:"",
    gold:0,
    hp:{max:null,current:null,temp:0},
    hitDiceUsed:0,
    spells:{cantrips:[],known:[]},
    personality:{traits:"",ideals:"",bonds:"",flaws:""},
    notes:"",
    inspiration:false,
  };
  return c;
}

/* --------------------------- content fetching --------------------------- */
function loadCache(){
  try{ state.cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); }
  catch(e){ state.cache = {}; }
}
function saveCache(){ localStorage.setItem(CACHE_KEY, JSON.stringify(state.cache)); }

async function api(path){
  const key = path;
  const entry = state.cache[key];
  if(entry && (Date.now() - entry.t < CACHE_TTL_MS)){
    return entry.d;
  }
  const res = await fetch(CONTENT_BASE + path);
  if(!res.ok) throw new Error("Content fetch failed: " + path + " (" + res.status + ")");
  const data = await res.json();
  state.cache[key] = {t:Date.now(), d:data};
  saveCache();
  return data;
}

let _listCache = {};
async function apiList(kind){
  if(_listCache[kind]) return _listCache[kind];
  const data = await api("/" + kind);
  _listCache[kind] = data.results || [];
  return _listCache[kind];
}

function forceRefreshContent(){
  state.cache = {};
  _listCache = {};
  localStorage.removeItem(CACHE_KEY);
  homebrewCache = { races:[], classes:[], backgrounds:[], spells:[], equipment:[], features:[], loadedAt:0 };
  showToast("Content cache cleared — latest data will be fetched from the source.");
  render();
}

const USE_SRD_KEY = "bfa_use_srd_v1";
function getUseSrd(){ const v = localStorage.getItem(USE_SRD_KEY); return v===null ? true : v==='1'; }
function setUseSrd(v){ localStorage.setItem(USE_SRD_KEY, v ? '1':'0'); }

function isHomebrewIndex(idx){ return typeof idx === 'string' && idx.startsWith('hb-'); }

async function getRaces(){
  const hb = await loadAllHomebrew();
  const srd = getUseSrd() ? await apiList('races') : [];
  return [...srd, ...hb.races];
}
async function getClasses(){
  const hb = await loadAllHomebrew();
  const srd = getUseSrd() ? await apiList('classes') : [];
  return [...srd, ...hb.classes];
}
async function getBackgrounds(){
  const hb = await loadAllHomebrew();
  let srd = [];
  if(getUseSrd()){ try{ srd = await apiList('backgrounds'); }catch(e){ srd = []; } }
  return [...srd, ...hb.backgrounds];
}
async function getEquipmentList(){
  const hb = await loadAllHomebrew();
  const srd = getUseSrd() ? await apiList('equipment') : [];
  return [...srd, ...hb.equipment];
}
async function getRaceDetail(index, list){
  if(isHomebrewIndex(index)) return (list||(await getRaces())).find(r=>r.index===index) || null;
  return api('/races/'+index);
}
async function getClassDetail(index, list){
  if(isHomebrewIndex(index)) return (list||(await getClasses())).find(cl=>cl.index===index) || null;
  return api('/classes/'+index);
}
async function getClassSpells(index, classDetail){
  if(isHomebrewIndex(index)){
    const hb = await loadAllHomebrew();
    return { results: hb.spells.filter(s=>slug(s.klass)===slug(classDetail?.name||'')) };
  }
  return api(`/classes/${index}/spells`);
}

function mod(score){ return Math.floor((score-10)/2); }
function fmtMod(n){ return (n>=0?"+":"") + n; }
function profBonus(level){ return Math.ceil(level/4) + 1; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

function effectiveAbilities(c, raceData, subraceData){
  const out = {...c.abilityScores};
  const applyBonuses = (bonuses) => {
    (bonuses||[]).forEach(b=>{
      const key = b.ability_score.index;
      out[key] = (out[key]||10) + b.bonus;
    });
  };
  if(raceData) applyBonuses(raceData.ability_bonuses);
  if(subraceData) applyBonuses(subraceData.ability_bonuses);
  return out;
}

/* ------------------------------- rendering ------------------------------- */
const appEl = document.getElementById('app');

function renderCharList(){
  if(!state.characters.length) return `<div style="padding:.6rem; color:var(--ink-faint); font-size:.8rem;">No characters yet.</div>`;
  return state.characters.map(c => `
    <div class="char-item ${c.id === state.activeId ? 'active' : ''}" data-id="${c.id}">
      <div>
        <div class="nm">${esc(c.name)}</div>
        <div class="meta">Lvl ${c.level}</div>
      </div>
      <button class="del" title="Delete character">✕</button>
    </div>
  `).join('');
}

function renderStepNav(){
  return `
    <div class="steps">
      <div class="rail-section" style="padding-left:0;">Builder Steps</div>
      ${STEPS.map((s, idx) => `
        <button class="step-btn ${state.step === s.id ? 'active' : ''}" data-step="${s.id}">
          <span class="num">${idx + 1}</span>
          <span>${s.label}</span>
        </button>
      `).join('')}
    </div>
  `;
}

function renderEmptyState(){
  return `
    <div class="empty-state">
      <h2>Welcome to Boss Fight Archive</h2>
      <p>Select or create a character on the left sidebar to start building.</p>
    </div>
  `;
}

function onNewCharacter(){
  const c = newCharacter("New Character");
  state.characters.unshift(c);
  state.activeId = c.id;
  state.step = "identity";
  state.showSettings = false;
  persistCharacters();
  render();
}

function renderMain(c){
  const main = document.querySelector('main');
  main.innerHTML = `<div class="topbar"><h1>${esc(c.name)}</h1><div class="status">Step: ${state.step}</div></div><div class="panel"><p>Content loading for ${state.step}...</p></div>`;
}

function renderSettingsPanel(){
  const main = document.querySelector('main');
  const sources = loadHomebrewSources();
  const uploads = loadUploadedFiles();
  main.innerHTML = `
    <div class="topbar"><h1>Content Sources</h1></div>
    <div class="panel">
      <h2>Where character content comes from</h2>
      <div class="field" style="display:flex; align-items:center; gap:.6rem;">
        <input type="checkbox" id="use-srd" ${getUseSrd()?'checked':''} style="width:auto;">
        <label style="margin:0;" for="use-srd">Include the free, open-license D&amp;D 5e SRD content (races, classes, spells, equipment)</label>
      </div>
      <div class="hint">Turn this off if you only want the content from your own files below.</div>
    </div>
    <div class="panel">
      <h2>Upload your own content files</h2>
      <p class="hint" style="margin-bottom:1rem;">Upload XML files (Aurora elements format or homebrew XML schema). Parsed and stored locally in this browser.</p>
      <input type="file" id="file-upload" accept=".xml" multiple style="margin-bottom:1rem;">
      <div id="upload-list">
        ${uploads.length ? uploads.map(f=>`
          <div class="equip-row">
            <span class="en">${esc(f.name)} <span class="hint" style="display:inline;">— added ${new Date(f.addedAt).toLocaleDateString()}</span></span>
            <button class="btn ghost upload-del" data-name="${esc(f.name)}">✕</button>
          </div>
        `).join('') : '<p class="hint">No files uploaded yet.</p>'}
      </div>
      <div class="btn-row">
        <button class="btn secondary" id="reload-sources">Reload content now</button>
      </div>
    </div>
  `;

  document.getElementById('use-srd').addEventListener('change', (e)=>{ setUseSrd(e.target.checked); });
  document.getElementById('file-upload').addEventListener('change', (e)=>{
    const files = Array.from(e.target.files);
    let count = 0;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          addUploadedFile(file.name, evt.target.result);
          count++;
          if(count === files.length) {
            showToast(`Uploaded ${count} file(s)`);
            loadAllHomebrew(true).then(() => renderSettingsPanel());
          }
        } catch(err) {
          showToast(`Error reading ${file.name}: ${err.message}`);
        }
      };
      reader.readAsText(file);
    });
  });

  main.querySelectorAll('.upload-del').forEach(btn => {
    btn.addEventListener('click', () => {
      removeUploadedFile(btn.dataset.name);
      loadAllHomebrew(true).then(() => renderSettingsPanel());
    });
  });

  document.getElementById('reload-sources')?.addEventListener('click', () => {
    forceRefreshContent();
  });
}

function render(){
  const c = activeChar();
  appEl.innerHTML = `
    <div class="rail">
      <div class="rail-brand">
        <div class="mark">BOSS FIGHT ARCHIVE</div>
        <div class="sub">Character Builder</div>
      </div>
      <div class="rail-section">Your characters</div>
      <div class="char-list">${renderCharList()}</div>
      <button class="new-char-btn" id="btn-new-char">+ New character</button>
      ${c && !state.showSettings ? renderStepNav() : ''}
      <div style="padding:.6rem; border-top:1px solid var(--line); margin-top:auto;">
        <button class="btn ghost" id="btn-content-sources" style="width:100%; text-align:left; font-size:.8rem;">⚙ Content Sources</button>
      </div>
    </div>
    <main>${state.showSettings ? '' : (c ? '' : renderEmptyState())}</main>
  `;
  document.getElementById('btn-new-char').addEventListener('click', onNewCharacter);
  document.getElementById('btn-content-sources').addEventListener('click', ()=>{ state.showSettings = true; render(); });
  appEl.querySelectorAll('.char-item').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.del')) return;
      state.activeId = el.dataset.id;
      state.step = "identity";
      state.showSettings = false;
      render();
    });
  });
  appEl.querySelectorAll('.char-item .del').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.closest('.char-item').dataset.id;
      const ch = state.characters.find(x=>x.id===id);
      if(confirm(`Delete "${ch.name}"? This can't be undone.`)){
        state.characters = state.characters.filter(x=>x.id!==id);
        persistCharacters();
        if(state.activeId===id) state.activeId = state.characters[0]?.id || null;
        render();
      }
    });
  });

  if(state.showSettings){
    renderSettingsPanel();
  } else if(c){
    appEl.querySelectorAll('.step-btn').forEach(el=>{
      el.addEventListener('click', ()=>{ state.step = el.dataset.step; render(); });
    });
    renderMain(c);
  }
}

// Initial initialization
loadCache();
loadCharacters();
if(state.characters.length > 0) state.activeId = state.characters[0].id;
render();

</script>
