<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Fight Archive — Character Builder</title>
<meta name="description" content="Build, save, and export D&D 5e character sheets. Nothing leaves your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral+SC:wght@600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#141110;
    --panel:#1c1815;
    --panel-2:#231e1a;
    --raised:#2a241f;
    --line:#3a332b;
    --line-soft:#2a241f;
    --ink:#ece4d6;
    --ink-dim:#b3a996;
    --ink-faint:#7c7263;
    --ember:#c7451d;
    --ember-bright:#e0632f;
    --gold:#b5903a;
    --hp-green:#5c7a4f;
    --danger:#a63a3a;
    --font-display:'Spectral', serif;
    --font-display-sc:'Spectral SC', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
  }
  ::selection{background:var(--ember); color:#fff;}
  a{color:var(--ember-bright);}
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0 0 .4em; color:var(--ink);}
  button{font-family:var(--font-body); cursor:pointer;}
  input,select,textarea{font-family:var(--font-body); color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius); padding:.5em .65em; font-size:.95rem;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--ember);}
  label{display:block; font-size:.72rem; letter-spacing:.02em; color:var(--ink-faint); margin-bottom:.3em; text-transform:none;}
  .field{margin-bottom:1rem;}
  .hint{font-size:.78rem; color:var(--ink-faint); margin-top:.3em;}

  /* ---------- App shell ---------- */
  #app{display:flex; min-height:100vh;}
  .rail{
    width:230px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .rail-brand{
    padding:1.1rem 1.1rem .9rem; border-bottom:1px solid var(--line);
  }
  .rail-brand .mark{font-family:var(--font-display-sc); font-size:.92rem; letter-spacing:.04em; color:var(--ember-bright);}
  .rail-brand .sub{font-size:.72rem; color:var(--ink-faint); margin-top:.2rem;}
  .rail-section{padding:.9rem 1.1rem .3rem; font-size:.68rem; color:var(--ink-faint); letter-spacing:.04em;}
  .char-list{padding:0 .6rem;}
  .char-item{
    display:flex; align-items:center; justify-content:space-between; gap:.4rem;
    padding:.55rem .6rem; border-radius:var(--radius); cursor:pointer; margin-bottom:.15rem;
    border:1px solid transparent;
  }
  .char-item:hover{background:var(--raised);}
  .char-item.active{background:var(--panel-2); border-color:var(--line);}
  .char-item .nm{font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .char-item .meta{font-size:.68rem; color:var(--ink-faint);}
  .char-item .del{opacity:0; background:none; border:none; color:var(--ink-faint); font-size:.9rem; padding:.1rem .3rem;}
  .char-item:hover .del{opacity:1;}
  .char-item .del:hover{color:var(--danger);}
  .new-char-btn{
    margin:.4rem .6rem 1rem; padding:.55rem .6rem; text-align:left;
    background:none; border:1px dashed var(--line); border-radius:var(--radius);
    color:var(--ink-dim); font-size:.85rem; width:calc(100% - 1.2rem);
  }
  .new-char-btn:hover{border-color:var(--ember); color:var(--ember-bright);}

  .steps{padding:0 .6rem; margin-top:auto; border-top:1px solid var(--line); padding-top:.7rem; padding-bottom:.8rem;}
  .step-btn{
    display:flex; align-items:center; gap:.55rem; width:100%; text-align:left;
    background:none; border:none; color:var(--ink-faint); padding:.5rem .6rem;
    border-radius:var(--radius); font-size:.85rem;
  }
  .step-btn .num{
    font-family:var(--font-mono); font-size:.68rem; width:1.3rem; height:1.3rem;
    border:1px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .step-btn.active{color:var(--ink); background:var(--panel-2);}
  .step-btn.active .num{border-color:var(--ember); color:var(--ember-bright);}
  .step-btn.done .num{border-color:var(--gold); color:var(--gold);}
  .step-btn:hover{color:var(--ink);}

  main{flex:1; min-width:0; padding:2.4rem 3rem 5rem; max-width:980px;}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:1.6rem; flex-wrap:wrap; gap:.6rem;}
  .topbar h1{font-size:1.5rem; margin:0;}
  .topbar .status{font-size:.72rem; color:var(--ink-faint); font-family:var(--font-mono);}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:1.6rem 1.8rem; margin-bottom:1.4rem;}
  .panel h2{font-size:1.15rem; border-bottom:1px solid var(--line); padding-bottom:.55rem; margin-bottom:1.1rem;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:1rem 1.4rem;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:1rem 1.4rem;}
  @media (max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  .btn{
    background:var(--ember); color:#fff; border:none; padding:.6rem 1.1rem;
    border-radius:var(--radius); font-size:.88rem; font-weight:600; letter-spacing:.01em;
  }
  .btn:hover{background:var(--ember-bright);}
  .btn:disabled{background:var(--line); color:var(--ink-faint); cursor:not-allowed;}
  .btn.secondary{background:none; border:1px solid var(--line); color:var(--ink-dim);}
  .btn.secondary:hover{border-color:var(--ink-dim); color:var(--ink);}
  .btn.ghost{background:none; border:none; color:var(--ink-faint); padding:.4rem .6rem;}
  .btn.ghost:hover{color:var(--ink);}
  .btn-row{display:flex; gap:.6rem; margin-top:1.5rem; flex-wrap:wrap;}
  .btn-row.split{justify-content:space-between;}

  .card{
    border:1px solid var(--line); border-radius:var(--radius); padding:.9rem 1rem; cursor:pointer;
    background:var(--panel-2); transition:border-color .1s;
  }
  .card:hover{border-color:var(--ink-faint);}
  .card.selected{border-color:var(--ember); background:#241a15;}
  .card h3{font-size:.98rem; margin-bottom:.25rem;}
  .card p{font-size:.8rem; color:var(--ink-dim); margin:0; line-height:1.45;}
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:.7rem;}

  .pill{display:inline-block; font-size:.68rem; padding:.15rem .5rem; border:1px solid var(--line); border-radius:20px; color:var(--ink-faint); margin-right:.3rem;}

  .search{width:100%; margin-bottom:1rem;}

  .loader{display:flex; align-items:center; gap:.6rem; color:var(--ink-faint); font-size:.85rem; padding:1rem 0;}
  .spinner{width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--ember); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .error-box{border:1px solid var(--danger); background:#2a1717; color:#e0b8b8; padding:.9rem 1rem; border-radius:var(--radius); font-size:.85rem; margin-bottom:1rem;}

  .toast{position:fixed; bottom:1.4rem; left:50%; transform:translateX(-50%); background:var(--raised); border:1px solid var(--line); color:var(--ink); padding:.6rem 1.1rem; border-radius:var(--radius); font-size:.85rem; z-index:999; box-shadow:0 6px 24px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  /* ability score boxes */
  .ability-box{border:1px solid var(--line); border-radius:var(--radius); padding:.8rem; text-align:center; background:var(--panel-2);}
  .ability-box .lbl{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.08em; color:var(--ink-faint);}
  .ability-box input{width:70px; text-align:center; font-size:1.3rem; font-family:var(--font-display); margin:.35rem 0 .2rem;}
  .ability-box .mod{font-size:.78rem; color:var(--ink-dim); font-family:var(--font-mono);}
  .pool-readout{font-family:var(--font-mono); font-size:.85rem; color:var(--ink-dim); margin-bottom:1rem;}
  .method-tabs{display:flex; gap:.5rem; margin-bottom:1.2rem;}
  .method-tabs button{flex:1;}

  table.sheet-table{width:100%; border-collapse:collapse; font-size:.85rem;}
  table.sheet-table th, table.sheet-table td{text-align:left; padding:.4rem .3rem; border-bottom:1px solid var(--line-soft);}
  table.sheet-table th{color:var(--ink-faint); font-weight:500; font-size:.72rem;}

  .skill-row{display:flex; align-items:center; gap:.55rem; padding:.35rem 0; border-bottom:1px solid var(--line-soft); font-size:.85rem;}
  .skill-row input[type=checkbox]{accent-color:var(--ember);}
  .skill-row .sname{flex:1;}
  .skill-row .sability{font-family:var(--font-mono); font-size:.68rem; color:var(--ink-faint); width:2.2rem;}
  .skill-row .smod{font-family:var(--font-mono); width:2.6rem; text-align:right;}

  .equip-row{display:flex; align-items:center; gap:.6rem; padding:.4rem 0; border-bottom:1px solid var(--line-soft);}
  .equip-row .en{flex:1; font-size:.87rem;}
  .equip-row input[type=number]{width:56px;}

  .chip-list{display:flex; flex-wrap:wrap; gap:.4rem;}
  .chip{background:var(--panel-2); border:1px solid var(--line); border-radius:20px; padding:.25rem .7rem; font-size:.78rem; display:flex; align-items:center; gap:.4rem;}
  .chip button{background:none; border:none; color:var(--ink-faint); font-size:.85rem; padding:0;}

  /* ---------------- Character sheet (also used for print) ---------------- */
  .sheet{
    background:#f4efe4; color:#231d16; border-radius:2px; padding:2.2rem 2.4rem;
    font-family:var(--font-body);
  }
  .sheet *{color:#231d16;}
  .sheet .sheet-head{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #231d16; padding-bottom:.7rem; margin-bottom:1.2rem;}
  .sheet .sheet-head h2{font-family:var(--font-display); font-size:1.9rem; margin:0;}
  .sheet .sheet-head .sub{font-size:.82rem; color:#5b5142;}
  .sheet-grid{display:grid; grid-template-columns:1.1fr 1fr 1.3fr; gap:1.4rem;}
  @media (max-width:900px){.sheet-grid{grid-template-columns:1fr;}}
  .sheet-block{margin-bottom:1.1rem;}
  .sheet-block h4{font-family:var(--font-display-sc); font-size:.78rem; letter-spacing:.06em; border-bottom:1px solid #cabf9f; padding-bottom:.3rem; margin-bottom:.5rem; color:#5b5142;}
  .statline{display:flex; justify-content:space-between; font-size:.86rem; padding:.15rem 0;}
  .abil-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem;}
  .abil-cell{border:1px solid #cabf9f; border-radius:4px; text-align:center; padding:.45rem 0;}
  .abil-cell .an{font-size:.65rem; letter-spacing:.08em; color:#5b5142;}
  .abil-cell .av{font-family:var(--font-display); font-size:1.15rem;}
  .abil-cell .am{font-size:.7rem; color:#5b5142;}
  .sheet-hp{display:flex; gap:.8rem;}
  .sheet-hp .hb{flex:1; border:1px solid #cabf9f; border-radius:4px; text-align:center; padding:.5rem 0;}
  .sheet-hp .hb .n{font-family:var(--font-display); font-size:1.3rem;}
  .sheet-hp .hb .l{font-size:.65rem; color:#5b5142;}
  .sheet ul{margin:.2rem 0; padding-left:1.1rem; font-size:.85rem;}
  .sheet .prose{font-size:.85rem; white-space:pre-wrap;}

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute; top:0; left:0; width:100%; margin:0; padding:0;}
    .sheet{box-shadow:none; border-radius:0;}
  }
  #print-area{display:none;}

  .empty-state{text-align:center; padding:4rem 1rem; color:var(--ink-faint);}
  .empty-state h2{color:var(--ink-dim);}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--void);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
</style>
</head>
<body>

<div id="app"></div>
<div id="print-area"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   BOSS FIGHT ARCHIVE — CHARACTER BUILDER
   Single-file static app. No build step, no server. Deploy: GitHub Pages.
   Content: fetched live from the 5e SRD API (open-license D&D 5e content,
   backed by the 5e-bits/5e-database GitHub repo) — see CONTENT_BASE below.
   Character data: stored only in the browser (localStorage) + file export.
   ========================================================================= */

const CONTENT_BASE = "https://www.dnd5eapi.co/api/2014"; // free open-license SRD content
const CACHE_KEY = "bfa_content_cache_v1";
const CACHE_TTL_MS = 1000 * 60 * 60 * 12; // 12h
const STORE_KEY = "bfa_characters_v1";
const SOURCES_KEY = "bfa_homebrew_sources_v1"; // list of raw GitHub URLs to homebrew XML files

/* ---------------------------------------------------------------------
   HOMEBREW CONTENT SCHEMA (original format — not Aurora's index/file format)
   Point this at raw GitHub URLs of XML files shaped like:

   <content>
     <race name="Stormkin" source="...">
       <speed>30</speed><size>Medium</size>
       <ability_bonus ability="dex" value="2"/>
       <trait name="..."><description>...</description></trait>
       <language>Common</language>
     </race>
     <class name="Stormblade" hit_die="10" source="...">
       <saving_throw ability="str"/>
       <skill_choice count="2"><option skill="athletics"/></skill_choice>
     </class>
     <background name="..." source="..."><skill_proficiency skill="..."/></background>
     <spell name="..." level="1" school="Evocation" class="wizard" source="...">
       <description>...</description>
     </spell>
     <equipment name="..." category="Weapon" source="..."><cost>5 gp</cost></equipment>
   </content>
   --------------------------------------------------------------------- */

function loadHomebrewSources(){
  try{ return JSON.parse(localStorage.getItem(SOURCES_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveHomebrewSources(list){ localStorage.setItem(SOURCES_KEY, JSON.stringify(list)); }

const UPLOADS_KEY = "bfa_uploaded_homebrew_v1"; // locally-uploaded XML files: [{name, xml, addedAt}]
function loadUploadedFiles(){
  try{ return JSON.parse(localStorage.getItem(UPLOADS_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveUploadedFiles(list){
  try{ localStorage.setItem(UPLOADS_KEY, JSON.stringify(list)); return true; }
  catch(e){ showToast("Couldn't save that file — it may be too large for browser storage."); return false; }
}
function addUploadedFile(name, xmlText){
  // validate before storing
  parseHomebrewXml(xmlText, name); // throws if malformed
  const list = loadUploadedFiles();
  const existingIdx = list.findIndex(f=>f.name===name);
  const entry = {name, xml:xmlText, addedAt:Date.now()};
  if(existingIdx>=0) list[existingIdx] = entry; else list.push(entry);
  return saveUploadedFiles(list);
}
function removeUploadedFile(name){
  saveUploadedFiles(loadUploadedFiles().filter(f=>f.name!==name));
}

let homebrewCache = { races:[], classes:[], backgrounds:[], spells:[], equipment:[], loadedAt:0 };

function parseHomebrewXml(xmlText, sourceUrl){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('Malformed homebrew XML');
  const out = { races:[], classes:[], backgrounds:[], spells:[], equipment:[] };

  doc.querySelectorAll('content > race').forEach(el=>{
    out.races.push({
      index: 'hb-' + slug(el.getAttribute('name')),
      name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      speed: parseInt(el.querySelector('speed')?.textContent)||30,
      size: el.querySelector('size')?.textContent || 'Medium',
      ability_bonuses: Array.from(el.querySelectorAll('ability_bonus')).map(b=>({ability_score:{index:b.getAttribute('ability')}, bonus:parseInt(b.getAttribute('value'))})),
      traits: Array.from(el.querySelectorAll('trait')).map(t=>({name:t.getAttribute('name'), description:t.querySelector('description')?.textContent||''})),
      languages: Array.from(el.querySelectorAll('language')).map(l=>({name:l.textContent})),
      subraces: [],
    });
  });

  doc.querySelectorAll('content > class').forEach(el=>{
    out.classes.push({
      index: 'hb-' + slug(el.getAttribute('name')),
      name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      hit_die: parseInt(el.getAttribute('hit_die'))||8,
      saving_throws: Array.from(el.querySelectorAll('saving_throw')).map(s=>({index:s.getAttribute('ability'), name:s.getAttribute('ability').toUpperCase()})),
      proficiency_choices: (()=>{
        const sc = el.querySelector('skill_choice');
        if(!sc) return [];
        return [{ choose: parseInt(sc.getAttribute('count'))||2, from:{ options: Array.from(sc.querySelectorAll('option')).map(o=>({item:{index:'skill-'+o.getAttribute('skill')}})) } }];
      })(),
      spellcasting: !!el.querySelector('spellcasting'),
    });
  });

  doc.querySelectorAll('content > background').forEach(el=>{
    out.backgrounds.push({
      index: 'hb-' + slug(el.getAttribute('name')),
      name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      skills: Array.from(el.querySelectorAll('skill_proficiency')).map(s=>s.getAttribute('skill')),
    });
  });

  doc.querySelectorAll('content > spell').forEach(el=>{
    out.spells.push({
      index: 'hb-' + slug(el.getAttribute('name')),
      name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      level: parseInt(el.getAttribute('level'))||0,
      school: el.getAttribute('school')||'',
      klass: el.getAttribute('class')||'',
      description: el.querySelector('description')?.textContent||'',
    });
  });

  doc.querySelectorAll('content > equipment').forEach(el=>{
    out.equipment.push({
      index: 'hb-' + slug(el.getAttribute('name')),
      name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      category: el.getAttribute('category')||'',
      cost: el.querySelector('cost')?.textContent||'',
    });
  });

  return out;
}
function slug(s){ return (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

async function loadAllHomebrew(force){
  const sources = loadHomebrewSources();
  const uploads = loadUploadedFiles();
  if(!sources.length && !uploads.length){ homebrewCache = { races:[], classes:[], backgrounds:[], spells:[], equipment:[], loadedAt:Date.now() }; return homebrewCache; }
  if(!force && Date.now() - homebrewCache.loadedAt < CACHE_TTL_MS && homebrewCache.loadedAt) return homebrewCache;
  const merged = { races:[], classes:[], backgrounds:[], spells:[], equipment:[] };

  // locally-uploaded files first — no network needed, always available
  for(const file of uploads){
    try{
      const parsed = parseHomebrewXml(file.xml, file.name);
      Object.keys(merged).forEach(k=>merged[k].push(...parsed[k]));
    }catch(err){
      console.warn('Uploaded file failed to parse:', file.name, err);
      state.errors['hb:'+file.name] = err.message;
    }
  }
  // then remote URL sources, if any are configured
  for(const url of sources){
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      const parsed = parseHomebrewXml(text, url);
      Object.keys(merged).forEach(k=>merged[k].push(...parsed[k]));
    }catch(err){
      console.warn('Homebrew source failed:', url, err);
      state.errors['hb:'+url] = err.message;
    }
  }
  homebrewCache = { ...merged, loadedAt: Date.now() };
  return homebrewCache;
}

const SKILLS = [
  ["acrobatics","dex"],["animal-handling","wis"],["arcana","int"],["athletics","str"],
  ["deception","cha"],["history","int"],["insight","wis"],["intimidation","cha"],
  ["investigation","int"],["medicine","wis"],["nature","int"],["perception","wis"],
  ["performance","cha"],["persuasion","cha"],["religion","int"],["sleight-of-hand","dex"],
  ["stealth","dex"],["survival","wis"]
];
const ABILS = ["str","dex","con","int","wis","cha"];
const ABIL_NAMES = {str:"Strength",dex:"Dexterity",con:"Constitution",int:"Intelligence",wis:"Wisdom",cha:"Charisma"};

const STEPS = [
  {id:"identity", label:"Identity"},
  {id:"race", label:"Race"},
  {id:"class", label:"Class"},
  {id:"abilities", label:"Ability Scores"},
  {id:"background", label:"Background & Skills"},
  {id:"equipment", label:"Equipment"},
  {id:"spells", label:"Spells"},
  {id:"sheet", label:"Character Sheet"},
];

/* --------------------------- tiny state store --------------------------- */
const state = {
  characters: [],
  activeId: null,
  step: "identity",
  cache: {},
  loading: {},
  errors: {},
  showSettings: false,
};

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadCharacters(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    state.characters = raw ? JSON.parse(raw) : [];
  }catch(e){ state.characters = []; }
}
function persistCharacters(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state.characters));
}
function activeChar(){
  return state.characters.find(c => c.id === state.activeId) || null;
}
function touch(c){ c.updatedAt = Date.now(); persistCharacters(); }

function newCharacter(name){
  const c = {
    id: uid(),
    name: name || "Unnamed Adventurer",
    createdAt: Date.now(), updatedAt: Date.now(),
    playerName:"", alignment:"", level:1, xp:0,
    raceIndex:null, subraceIndex:null,
    classIndex:null,
    backgroundIndex:null, backgroundCustom:"",
    abilityMethod:"standard",
    abilityScores:{str:10,dex:10,con:10,int:10,wis:10,cha:10},
    skillProfs:[],
    languages:[],
    equipment:[], // {index,name,qty}
    equipmentNotes:"",
    gold:0,
    hp:{max:null,current:null,temp:0},
    hitDiceUsed:0,
    spells:{cantrips:[],known:[]},
    personality:{traits:"",ideals:"",bonds:"",flaws:""},

}

/* --------------------------- content fetching --------------------------- */
function loadCache(){
  try{ state.cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); }
  catch(e){ state.cache = {}; }
}
function saveCache(){ localStorage.setItem(CACHE_KEY, JSON.stringify(state.cache)); }

async function api(path){
  const key = path;
  const entry = state.cache[key];
  if(entry && (Date.now() - entry.t < CACHE_TTL_MS)){
    return entry.d;
  }
  const res = await fetch(CONTENT_BASE + path);
  if(!res.ok) throw new Error("Content fetch failed: " + path + " (" + res.status + ")");
  const data = await res.json();
  state.cache[key] = {t:Date.now(), d:data};
  saveCache();
  return data;
}
// convenience list caches (avoid refetching lists constantly)
let _listCache = {};
async function apiList(kind){
  if(_listCache[kind]) return _listCache[kind];
  const data = await api("/" + kind);
  _listCache[kind] = data.results || [];
  return _listCache[kind];
}

function forceRefreshContent(){
  state.cache = {};
  _listCache = {};
  localStorage.removeItem(CACHE_KEY);
  homebrewCache = { races:[], classes:[], backgrounds:[], spells:[], equipment:[], loadedAt:0 };
  showToast("Content cache cleared — latest data will be fetched from the source.");
  render();
}

/* -------- combined content getters: merges SRD (if enabled) + homebrew -------- */
const USE_SRD_KEY = "bfa_use_srd_v1";
function getUseSrd(){ const v = localStorage.getItem(USE_SRD_KEY); return v===null ? true : v==='1'; }
function setUseSrd(v){ localStorage.setItem(USE_SRD_KEY, v ? '1':'0'); }

function isHomebrewIndex(idx){ return typeof idx === 'string' && idx.startsWith('hb-'); }

async function getRaces(){
  const hb = await loadAllHomebrew();
  const srd = getUseSrd() ? await apiList('races') : [];
  return [...srd, ...hb.races];
}
async function getClasses(){
  const hb = await loadAllHomebrew();
  const srd = getUseSrd() ? await apiList('classes') : [];
  return [...srd, ...hb.classes];
}
async function getBackgrounds(){
  const hb = await loadAllHomebrew();
  let srd = [];
  if(getUseSrd()){ try{ srd = await apiList('backgrounds'); }catch(e){ srd = FALLBACK_BACKGROUNDS; } }
  return [...srd, ...hb.backgrounds];
}
async function getEquipmentList(){
  const hb = await loadAllHomebrew();
  const srd = getUseSrd() ? await apiList('equipment') : [];
  return [...srd, ...hb.equipment];
}
async function getRaceDetail(index, list){
  if(isHomebrewIndex(index)) return (list||(await getRaces())).find(r=>r.index===index) || null;
  return api('/races/'+index);
}
async function getClassDetail(index, list){
  if(isHomebrewIndex(index)) return (list||(await getClasses())).find(cl=>cl.index===index) || null;
  return api('/classes/'+index);
}
async function getClassSpells(index, classDetail){
  if(isHomebrewIndex(index)){
    const hb = await loadAllHomebrew();
    return { results: hb.spells.filter(s=>slug(s.klass)===slug(classDetail?.name||'')) };
  }
  return api(`/classes/${index}/spells`);
}

/* --------------------------------- utils --------------------------------- */
function mod(score){ return Math.floor((score-10)/2); }
function fmtMod(n){ return (n>=0?"+":"") + n; }
function profBonus(level){ return Math.ceil(level/4) + 1; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* effective ability score = base + racial bonus + subrace bonus */
function effectiveAbilities(c, raceData, subraceData){
  const out = {...c.abilityScores};
  const applyBonuses = (bonuses) => {
    (bonuses||[]).forEach(b=>{
      const key = b.ability_score.index;
      out[key] = (out[key]||10) + b.bonus;
    });
  };
  if(raceData) applyBonuses(raceData.ability_bonuses);
  if(subraceData) applyBonuses(subraceData.ability_bonuses);
  return out;
}

    const detail = selected ? await getClassDetail(selected.index, classes) : null;

    body.innerHTML = `
      <div class="panel">
        <h2>Class</h2>
        <div class="card-grid">
          ${classes.map(cl=>`
            <div class="card ${c.classIndex===cl.index?'selected':''}" data-index="${cl.index}">
              <h3>${esc(cl.name)}</h3>
              <p>Tap to view &amp; select</p>
            </div>
          `).join('')}
        </div>
      </div>
      ${detail ? renderClassDetail(detail, c) : ''}
      ${stepFooter(c)}
    `;
    document.querySelectorAll('.card-grid .card').forEach(el=>{
      el.addEventListener('click', ()=>{
        c.classIndex = el.dataset.index;
        c.skillProfs = []; // reset skill picks - class grants differ
        touch(c);
        renderClassStep(c, body);
      });
    });
    wireFooter(c);
  }catch(err){
    body.innerHTML = `<div class="error-box">Couldn't load class data: ${esc(err.message)}.</div>${stepFooter(c)}`;
    wireFooter(c);
  }
}

function renderClassDetail(detail, c){
  const saves = (detail.saving_throws||[]).map(s=>s.name).join(', ');
  const casterNote = detail.spellcasting ? `<span class="pill">Spellcaster</span>` : '';
  return `
    <div class="panel">
      <h2>${esc(detail.name)} ${casterNote}</h2>
      <div class="grid-2">
        <div class="statline"><span>Hit die</span><span>d${detail.hit_die}</span></div>
        <div class="statline"><span>Saving throw proficiencies</span><span>${saves}</span></div>
      </div>
      <div class="hint" style="margin-top:.8rem;">Skill and equipment choices for this class appear in the Background &amp; Skills and Equipment steps.</div>
    </div>
  `;
}

/* ------------------------------ Step: Abilities ------------------------------ */
const STANDARD_ARRAY = [15,14,13,12,10,8];
const POINT_BUY_COST = {8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};

function renderAbilitiesStep(c, body){
  body.innerHTML = `
    <div class="panel">
      <h2>Ability Scores</h2>
      <div class="method-tabs">
        <button class="btn ${c.abilityMethod==='standard'?'':'secondary'}" data-m="standard">Standard array</button>
        <button class="btn ${c.abilityMethod==='pointbuy'?'':'secondary'}" data-m="pointbuy">Point buy</button>
        <button class="btn ${c.abilityMethod==='manual'?'':'secondary'}" data-m="manual">Manual / rolled</button>
      </div>
      <div id="method-body"></div>
    </div>
    ${stepFooter(c)}
  `;
  document.querySelectorAll('.method-tabs button').forEach(b=>{
    b.addEventListener('click', ()=>{ c.abilityMethod = b.dataset.m; touch(c); renderAbilitiesStep(c, body); });
  });
  const mb = document.getElementById('method-body');
  if(c.abilityMethod==='pointbuy') renderPointBuy(c, mb);
  else renderSimpleAbilities(c, mb, c.abilityMethod==='standard');
  wireFooter(c);
}

function renderSimpleAbilities(c, mb, isStandard){
  mb.innerHTML = `
    ${isStandard ? `<div class="hint" style="margin-bottom:1rem;">Assign each value from the standard array (${STANDARD_ARRAY.join(', ')}) to an ability — each value used once.</div>` : `<div class="hint" style="margin-bottom:1rem;">Enter your rolled or chosen scores directly.</div>`}
    <div class="grid-3">
      ${ABILS.map(a=>`
        <div class="ability-box">
          <div class="lbl">${a.toUpperCase()}</div>
          ${isStandard ? `
            <select id="a-${a}" style="width:100%; text-align:center; font-family:var(--font-display); font-size:1.1rem;">
              ${STANDARD_ARRAY.map(v=>`<option value="${v}" ${c.abilityScores[a]===v?'selected':''}>${v}</option>`).join('')}
            </select>
          ` : `<input id="a-${a}" type="number" min="1" max="30" value="${c.abilityScores[a]}">`}
          <div class="mod" id="m-${a}">${fmtMod(mod(c.abilityScores[a]))}</div>
        </div>
      `).join('')}
    </div>
  `;
  ABILS.forEach(a=>{
    document.getElementById('a-'+a).addEventListener(isStandard?'change':'input', e=>{
      const v = parseInt(e.target.value)||10;
      c.abilityScores[a]=v;
      document.getElementById('m-'+a).textContent = fmtMod(mod(v));
      touch(c);
    });
  });
}

function renderPointBuy(c, mb){
  const total = ABILS.reduce((s,a)=>s+(POINT_BUY_COST[c.abilityScores[a]]??0),0);
  const budget = 27;
  mb.innerHTML = `
    <div class="pool-readout">Points used: ${total} / ${budget}</div>
    <div class="grid-3">
      ${ABILS.map(a=>`
        <div class="ability-box">
          <div class="lbl">${a.toUpperCase()}</div>
          <div style="display:flex; align-items:center; justify-content:center; gap:.4rem; margin:.35rem 0 .2rem;">
            <button class="btn ghost" data-a="${a}" data-d="-1" style="font-size:1rem;">−</button>
            <span style="font-family:var(--font-display); font-size:1.3rem; min-width:2ch; display:inline-block; text-align:center;">${c.abilityScores[a]}</span>
            <button class="btn ghost" data-a="${a}" data-d="1" style="font-size:1rem;">+</button>
          </div>
          <div class="mod">${fmtMod(mod(c.abilityScores[a]))}</div>
        </div>
      `).join('')}
    </div>
    <div class="hint">Point-buy scores range 8–15 before racial bonuses. Standard 27-point budget.</div>
  `;
  mb.querySelectorAll('button[data-a]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const a = btn.dataset.a, d = parseInt(btn.dataset.d);
      const cur = c.abilityScores[a];
      const next = cur + d;
      if(next<8||next>15) return;
      const nextTotal = total - (POINT_BUY_COST[cur]??0) + (POINT_BUY_COST[next]??0);
      if(d>0 && nextTotal>budget) return;
      c.abilityScores[a]=next; touch(c); renderPointBuy(c, mb);
    });
  });
}

/* ------------------------------ Step: Background & Skills ------------------------------ */
const FALLBACK_BACKGROUNDS = [{index:"acolyte", name:"Acolyte", desc:"You have spent your life in service to a temple."}];

async function renderBackgroundStep(c, body){
  body.innerHTML = `<div class="panel"><h2>Background</h2><div class="loader"><div class="spinner"></div> Loading…</div></div>`;
  let backgrounds = await getBackgrounds();
  if(!backgrounds.length) backgrounds = FALLBACK_BACKGROUNDS;

  let classDetail = null, skillChoiceCount = 2, availableSkills = SKILLS.map(s=>s[0]);
  try{
    if(c.classIndex){
      classDetail = await getClassDetail(c.classIndex);
      const choice = (classDetail.proficiency_choices||[]).find(pc => (pc.from?.options||[]).some(o=>o.item?.index?.startsWith?.('skill-') || o.item?.index));
      if(choice){
        skillChoiceCount = choice.choose || 2;
        const opts = choice.from.options.map(o=>o.item.index.replace(/^skill-/,''));
        if(opts.length) availableSkills = opts;
      }
    }
  }catch(e){/* ignore, use defaults */}

  body.innerHTML = `
    <div class="panel">
      <h2>Background</h2>
      <div class="grid-2">
        <div>
          <div class="field">
            <label>Background</label>
            <select id="bg-select">
              <option value="">— custom —</option>
              ${backgrounds.map(b=>`<option value="${b.index}" ${c.backgroundIndex===b.index?'selected':''}>${b.name}</option>`).join('')}
            </select>
          </div>
          ${!c.backgroundIndex ? `<div class="field"><label>Custom background name</label><input id="bg-custom" value="${esc(c.backgroundCustom)}"></div>` : ''}
        </div>
        <div class="field"><label>Languages known</label>
          <div class="chip-list" id="lang-chips">${c.languages.map((l,i)=>`<span class="chip">${esc(l)} <button data-i="${i}">✕</button></span>`).join('')}</div>
          <input id="lang-add" placeholder="Type a language, press Enter" style="margin-top:.5rem; width:100%;">
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>Skill proficiencies</h2>
      <div class="hint" style="margin-bottom:.8rem;">
        ${classDetail ? `Choose ${skillChoiceCount} from your class's list${availableSkills.length<SKILLS.length? ' ('+availableSkills.map(s=>s.replace(/-/g,' ')).join(', ')+')':''}.` : 'Pick your class first for a tailored list — showing all skills for now.'}
        Selected: <span id="skill-count">${c.skillProfs.length}</span> / ${skillChoiceCount}
      </div>
      <div id="skill-list">
        ${SKILLS.map(([idx,ab])=>{
          const eligible = availableSkills.includes(idx);
          return `
          <div class="skill-row" style="${eligible?'':'opacity:.4;'}">
            <input type="checkbox" data-skill="${idx}" ${c.skillProfs.includes(idx)?'checked':''} ${eligible?'':'disabled'}>
            <span class="sname">${idx.replace(/-/g,' ')}</span>
            <span class="sability">${ab.toUpperCase()}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
    ${stepFooter(c)}
  `;

  document.getElementById('bg-select').addEventListener('change', e=>{
    c.backgroundIndex = e.target.value || null;
    touch(c); renderBackgroundStep(c, body);
  });
  const bgCustom = document.getElementById('bg-custom');
  if(bgCustom) bgCustom.addEventListener('input', e=>{ c.backgroundCustom = e.target.value; touch(c); });

  document.getElementById('lang-add').addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.value.trim()){
      c.languages.push(e.target.value.trim());
      e.target.value=''; touch(c); renderBackgroundStep(c, body);
    }
  });
  document.querySelectorAll('#lang-chips button').forEach(b=>{
    b.addEventListener('click', ()=>{ c.languages.splice(parseInt(b.dataset.i),1); touch(c); renderBackgroundStep(c, body); });
  });

  document.querySelectorAll('#skill-list input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const idx = cb.dataset.skill;
      if(cb.checked){
        if(c.skillProfs.length >= skillChoiceCount){ cb.checked=false; showToast(`You can only choose ${skillChoiceCount} skills.`); return; }
        c.skillProfs.push(idx);
      }else{
        c.skillProfs = c.skillProfs.filter(s=>s!==idx);
      }
      document.getElementById('skill-count').textContent = c.skillProfs.length;
      touch(c);
    });
  });
  wireFooter(c);
}

/* ------------------------------ Step: Equipment ------------------------------ */
async function renderEquipmentStep(c, body){
  body.innerHTML = `<div class="panel"><h2>Equipment</h2><div class="loader"><div class="spinner"></div> Loading equipment list…</div></div>`;
  let equipmentList = [];
  try{ equipmentList = await getEquipmentList(); }catch(e){/* leave empty, manual entry still works */}

  body.innerHTML = `
    <div class="panel">
      <h2>Add equipment</h2>
      <div class="grid-2">
        <div class="field">
          <label>Search the equipment list</label>
          <input id="eq-search" list="eq-datalist" placeholder="Start typing an item name…">
          <datalist id="eq-datalist">${equipmentList.map(e=>`<option value="${esc(e.name)}">`).join('')}</datalist>
        </div>
        <div class="field"><label>Gold pieces (gp)</label><input id="gp" type="number" min="0" value="${c.gold}"></div>
      </div>
      <button class="btn secondary" id="add-eq-btn">Add item</button>
    </div>
    <div class="panel">
      <h2>Carried equipment</h2>
      <div id="eq-rows">
        ${c.equipment.length ? c.equipment.map((it,i)=>`
          <div class="equip-row">
            <span class="en">${esc(it.name)}</span>
            <input type="number" min="1" value="${it.qty}" data-i="${i}" class="eq-qty">
            <button class="btn ghost eq-del" data-i="${i}">✕</button>
          </div>
        `).join('') : '<p class="hint">No equipment added yet.</p>'}
      </div>
    </div>
    <div class="panel">
      <h2>Notes</h2>
      <textarea id="eq-notes" rows="3" style="width:100%;" placeholder="Container details, magic item notes, attunement, etc.">${esc(c.equipmentNotes)}</textarea>
    </div>
    ${stepFooter(c)}
  `;

  document.getElementById('gp').addEventListener('input', e=>{ c.gold = parseInt(e.target.value)||0; touch(c); });
  document.getElementById('add-eq-btn').addEventListener('click', ()=>{
    const val = document.getElementById('eq-search').value.trim();
    if(!val) return;
    const match = equipmentList.find(e=>e.name.toLowerCase()===val.toLowerCase());
    c.equipment.push({index: match?match.index:val.toLowerCase().replace(/\s+/g,'-'), name: match?match.name:val, qty:1});
    touch(c);
    renderEquipmentStep(c, body);
  });
  document.querySelectorAll('.eq-qty').forEach(inp=>{
    inp.addEventListener('input', ()=>{ c.equipment[parseInt(inp.dataset.i)].qty = Math.max(1, parseInt(inp.value)||1); touch(c); });
  });
  document.querySelectorAll('.eq-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{ c.equipment.splice(parseInt(btn.dataset.i),1); touch(c); renderEquipmentStep(c, body); });
  });
  document.getElementById('eq-notes').addEventListener('input', e=>{ c.equipmentNotes = e.target.value; touch(c); });
  wireFooter(c);
}

/* ------------------------------ Step: Spells ------------------------------ */
async function renderSpellsStep(c, body){
  if(!c.classIndex){
    body.innerHTML = `<div class="panel"><h2>Spells</h2><p class="hint">Pick a class first — not every class casts spells.</p></div>${stepFooter(c)}`;
    wireFooter(c); return;
  }
  body.innerHTML = `<div class="panel"><h2>Spells</h2><div class="loader"><div class="spinner"></div> Checking spellcasting…</div></div>`;
  try{
    const classDetail = await getClassDetail(c.classIndex);
    if(!classDetail.spellcasting && !isHomebrewIndex(c.classIndex)){
      body.innerHTML = `<div class="panel"><h2>Spells</h2><p class="hint">${esc(classDetail.name)} doesn't cast spells in the core rules (barring subclass features not modeled here).</p></div>${stepFooter(c)}`;
      wireFooter(c); return;
    }
    const spellData = await getClassSpells(c.classIndex, classDetail);
    const spells = spellData.results || [];
    const cantrips = spells.filter(s=>s.level===0);
    const leveled = spells.filter(s=>s.level>0);

    body.innerHTML = `
      <div class="panel">
        <h2>${esc(classDetail.name)} spells</h2>
        <div class="hint" style="margin-bottom:1rem;">
          Slot counts and "spells known" vary by class/level in the full rules — pick freely here and adjust to your table's rules. Selected: cantrips ${c.spells.cantrips.length}, spells ${c.spells.known.length}.
        </div>
        <h4 style="color:var(--ink-dim); font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; margin-bottom:.5rem;">Cantrips</h4>
        <div class="chip-list" style="margin-bottom:1.2rem;">
          ${cantrips.map(s=>`<span class="chip" data-idx="${s.index}" data-kind="cantrips" style="cursor:pointer; ${c.spells.cantrips.includes(s.index)?'border-color:var(--ember); color:var(--ember-bright);':''}">${esc(s.name)}</span>`).join('')}
        </div>
        <h4 style="color:var(--ink-dim); font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; margin-bottom:.5rem;">Leveled spells</h4>
        <div class="chip-list">
          ${leveled.map(s=>`<span class="chip" data-idx="${s.index}" data-kind="known" style="cursor:pointer; ${c.spells.known.includes(s.index)?'border-color:var(--ember); color:var(--ember-bright);':''}">${esc(s.name)} <em style="opacity:.6; font-style:normal;">lvl ${s.level}</em></span>`).join('')}
        </div>
      </div>
      ${stepFooter(c)}
    `;
    body.querySelectorAll('.chip[data-idx]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const kind = chip.dataset.kind, idx = chip.dataset.idx;
        const arr = c.spells[kind];
        const pos = arr.indexOf(idx);
        if(pos>=0) arr.splice(pos,1); else arr.push(idx);
        touch(c);
        renderSpellsStep(c, body);
      });
    });
    wireFooter(c);
  }catch(err){
    body.innerHTML = `<div class="error-box">Couldn't load spell data: ${esc(err.message)}.</div>${stepFooter(c)}`;
    wireFooter(c);
  }
}

/* ------------------------------ Step: Sheet ------------------------------ */
async function renderSheetStep(c, body){
  body.innerHTML = `<div class="panel"><h2>Character Sheet</h2><div class="loader"><div class="spinner"></div> Assembling sheet…</div></div>`;
  let raceDetail=null, subraceDetail=null, classDetail=null;
  try{
    if(c.raceIndex) raceDetail = await getRaceDetail(c.raceIndex);
    if(c.subraceIndex && !isHomebrewIndex(c.subraceIndex)) subraceDetail = await api('/subraces/'+c.subraceIndex);
    if(c.classIndex) classDetail = await getClassDetail(c.classIndex);
  }catch(e){ /* proceed with what we have */ }

  const abilities = effectiveAbilities(c, raceDetail, subraceDetail);
  const pb = profBonus(c.level);
  const conMod = mod(abilities.con);
  const hitDie = classDetail? classDetail.hit_die : 8;
  const maxHpCalc = hitDie + conMod + (c.level-1)*(Math.floor(hitDie/2)+1 + conMod);
  const ac = 10 + mod(abilities.dex);
  const savingProfs = (classDetail?.saving_throws||[]).map(s=>s.index);

  const sheetHtml = buildSheetHtml(c, {raceDetail, subraceDetail, classDetail, abilities, pb, maxHpCalc, ac, savingProfs});

  body.innerHTML = `
    <div class="panel" style="background:none; border:none; padding:0;">
      <div class="btn-row" style="margin-top:0;">
        <button class="btn" id="btn-export-pdf">Export as PDF</button>
        <button class="btn secondary" id="btn-export-xml">Export as XML</button>
        <label class="btn secondary" style="display:inline-flex; align-items:center;">Import XML<input type="file" id="import-xml" accept=".xml" style="display:none;"></label>
        <button class="btn secondary" id="btn-refresh-content">Refresh content</button>
      </div>
    </div>
    <div class="sheet" id="sheet-view">${sheetHtml}</div>
    ${stepFooter(c)}
  `;
  document.getElementById('btn-export-pdf').addEventListener('click', ()=>exportPdf(sheetHtml));
  document.getElementById('btn-export-xml').addEventListener('click', ()=>exportXml(c));
  document.getElementById('import-xml').addEventListener('change', (e)=>importXml(e));
  document.getElementById('btn-refresh-content').addEventListener('click', forceRefreshContent);
  wireFooter(c);
}

function buildSheetHtml(c, ctx){
  const {raceDetail, subraceDetail, classDetail, abilities, pb, maxHpCalc, ac, savingProfs} = ctx;
  const hp = c.hp.max!=null ? c.hp : {max:maxHpCalc, current:maxHpCalc, temp:0};
  const skillRows = SKILLS.map(([idx,ab])=>{
    const proficient = c.skillProfs.includes(idx);
    const val = mod(abilities[ab]) + (proficient?pb:0);
    return `<div class="statline"><span>${proficient?'●':'○'} ${idx.replace(/-/g,' ')} <span style="opacity:.55;">(${ab})</span></span><span>${fmtMod(val)}</span></div>`;
  }).join('');
  const saveRows = ABILS.map(a=>{
    const proficient = savingProfs.includes(a);
    const val = mod(abilities[a]) + (proficient?pb:0);
    return `<div class="statline"><span>${proficient?'●':'○'} ${ABIL_NAMES[a]}</span><span>${fmtMod(val)}</span></div>`;
  }).join('');
  const passivePerception = 10 + mod(abilities.wis) + (c.skillProfs.includes('perception')?pb:0);

  return `
    <div class="sheet-head">
      <div>
        <h2>${esc(c.name)}</h2>
        <div class="sub">${esc(raceDetail?.name||'—')}${subraceDetail? ' ('+esc(subraceDetail.name)+')':''} · ${esc(classDetail?.name||'—')}, Level ${c.level} · ${esc(c.alignment||'—')}</div>
      </div>
      <div class="sub" style="text-align:right;">${esc(c.playerName||'')}<br>${esc(c.backgroundIndex||c.backgroundCustom||'')}</div>
    </div>
    <div class="sheet-grid">
      <div>
        <div class="sheet-block">
          <h4>Ability Scores</h4>
          <div class="abil-grid">
            ${ABILS.map(a=>`<div class="abil-cell"><div class="an">${a.toUpperCase()}</div><div class="av">${abilities[a]}</div><div class="am">${fmtMod(mod(abilities[a]))}</div></div>`).join('')}
          </div>
        </div>
        <div class="sheet-block">
          <h4>Saving Throws</h4>
          ${saveRows}
        </div>
        <div class="sheet-block">
          <h4>Combat</h4>
          <div class="sheet-hp">
            <div class="hb"><div class="n">${ac}</div><div class="l">Armor Class</div></div>
            <div class="hb"><div class="n">${fmtMod(mod(abilities.dex))}</div><div class="l">Initiative</div></div>
            <div class="hb"><div class="n">${raceDetail?.speed||30}</div><div class="l">Speed (ft)</div></div>
          </div>
          <div class="sheet-hp" style="margin-top:.6rem;">
            <div class="hb"><div class="n">${hp.max}</div><div class="l">Hit Point Max</div></div>
            <div class="hb"><div class="n">${pb>=0?'+':''}${pb}</div><div class="l">Proficiency</div></div>
            <div class="hb"><div class="n">${passivePerception}</div><div class="l">Passive Perception</div></div>
          </div>
        </div>
      </div>
      <div>
        <div class="sheet-block">
          <h4>Skills</h4>
          ${skillRows}
        </div>
      </div>
      <div>
        <div class="sheet-block">
          <h4>Equipment</h4>
          <ul>${c.equipment.map(it=>`<li>${esc(it.name)} ${it.qty>1?`×${it.qty}`:''}</li>`).join('') || '<li style="list-style:none; opacity:.6;">None recorded</li>'}</ul>
          <div class="statline"><span>Gold</span><span>${c.gold} gp</span></div>
          ${c.equipmentNotes? `<p class="prose">${esc(c.equipmentNotes)}</p>`:''}
        </div>
        <div class="sheet-block">
          <h4>Languages</h4>
          <p class="prose">${c.languages.join(', ') || '—'}</p>
        </div>
        ${(c.spells.cantrips.length||c.spells.known.length) ? `
        <div class="sheet-block">
          <h4>Spells</h4>
          ${c.spells.cantrips.length? `<p class="prose"><strong>Cantrips:</strong> ${c.spells.cantrips.map(s=>s.replace(/-/g,' ')).join(', ')}</p>`:''}
          ${c.spells.known.length? `<p class="prose"><strong>Known:</strong> ${c.spells.known.map(s=>s.replace(/-/g,' ')).join(', ')}</p>`:''}
        </div>`:''}
        <div class="sheet-block">
          <h4>Personality</h4>
          <p class="prose"><strong>Traits:</strong> ${esc(c.personality.traits)||'—'}</p>
          <p class="prose"><strong>Ideals:</strong> ${esc(c.personality.ideals)||'—'}</p>
          <p class="prose"><strong>Bonds:</strong> ${esc(c.personality.bonds)||'—'}</p>
          <p class="prose"><strong>Flaws:</strong> ${esc(c.personality.flaws)||'—'}</p>
        </div>
      </div>
    </div>
    ${c.notes? `<div class="sheet-block"><h4>Notes</h4><p class="prose">${esc(c.notes)}</p></div>`:''}
  `;
}

/* ------------------------------ Export: PDF (print) ------------------------------ */
function exportPdf(sheetHtml){
  const area = document.getElementById('print-area');
  area.innerHTML = `<div class="sheet">${sheetHtml}</div>`;
  document.title = (activeChar()?.name || 'character') + ' — Character Sheet';
  window.print();
}

/* ------------------------------ Export / Import: XML ------------------------------ */
function xmlEsc(s){ return (s==null?"":String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function exportXml(c){
  const x = `<?xml version="1.0" encoding="UTF-8"?>
<character schemaVersion="1">
  <name>${xmlEsc(c.name)}</name>
  <playerName>${xmlEsc(c.playerName)}</playerName>
  <alignment>${xmlEsc(c.alignment)}</alignment>
  <level>${c.level}</level>
  <race index="${xmlEsc(c.raceIndex)}" subrace="${xmlEsc(c.subraceIndex)}" />
  <class index="${xmlEsc(c.classIndex)}" />
  <background index="${xmlEsc(c.backgroundIndex)}" custom="${xmlEsc(c.backgroundCustom)}" />
  <abilityScores method="${xmlEsc(c.abilityMethod)}">
    ${ABILS.map(a=>`<${a}>${c.abilityScores[a]}</${a}>`).join('\n    ')}
  </abilityScores>
  <skillProficiencies>${c.skillProfs.map(s=>`<skill>${xmlEsc(s)}</skill>`).join('')}</skillProficiencies>
  <languages>${c.languages.map(l=>`<language>${xmlEsc(l)}</language>`).join('')}</languages>
  <equipment gold="${c.gold}">
    ${c.equipment.map(it=>`<item index="${xmlEsc(it.index)}" qty="${it.qty}">${xmlEsc(it.name)}</item>`).join('\n    ')}
  </equipment>
  <equipmentNotes>${xmlEsc(c.equipmentNotes)}</equipmentNotes>
  <hp max="${c.hp.max??''}" current="${c.hp.current??''}" temp="${c.hp.temp||0}" />
  <spells>
    ${c.spells.cantrips.map(s=>`<cantrip>${xmlEsc(s)}</cantrip>`).join('\n    ')}
    ${c.spells.known.map(s=>`<known>${xmlEsc(s)}</known>`).join('\n    ')}
  </spells>
  <personality>
    <traits>${xmlEsc(c.personality.traits)}</traits>
    <ideals>${xmlEsc(c.personality.ideals)}</ideals>
    <bonds>${xmlEsc(c.personality.bonds)}</bonds>
    <flaws>${xmlEsc(c.personality.flaws)}</flaws>
  </personality>
  <notes>${xmlEsc(c.notes)}</notes>
</character>`;
  const blob = new Blob([x], {type:'application/xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (c.name || 'character').replace(/[^a-z0-9\-_ ]/gi,'').trim() + '.xml';
  a.click();
  URL.revokeObjectURL(a.href);
}

function textOf(doc, tag, parent){
  const el = (parent||doc).querySelector(tag);
  return el ? el.textContent : '';
}
function importXml(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const doc = new DOMParser().parseFromString(ev.target.result, 'application/xml');
      if(doc.querySelector('parsererror')) throw new Error('Malformed XML file');
      const c = newCharacter(textOf(doc,'name') || 'Imported Character');
      c.playerName = textOf(doc,'playerName');
      c.alignment = textOf(doc,'alignment');
      c.level = parseInt(textOf(doc,'level'))||1;
      const raceEl = doc.querySelector('race');
      if(raceEl){ c.raceIndex = raceEl.getAttribute('index')||null; c.subraceIndex = raceEl.getAttribute('subrace')||null; }
      const classEl = doc.querySelector('class');
      if(classEl) c.classIndex = classEl.getAttribute('index')||null;
      const bgEl = doc.querySelector('background');
      if(bgEl){ c.backgroundIndex = bgEl.getAttribute('index')||null; c.backgroundCustom = bgEl.getAttribute('custom')||''; }
      const abEl = doc.querySelector('abilityScores');
      if(abEl){
        c.abilityMethod = abEl.getAttribute('method')||'manual';
        ABILS.forEach(a=>{ const v = textOf(doc,a,abEl); if(v) c.abilityScores[a]=parseInt(v); });
      }
      c.skillProfs = Array.from(doc.querySelectorAll('skillProficiencies skill')).map(n=>n.textContent);
      c.languages = Array.from(doc.querySelectorAll('languages language')).map(n=>n.textContent);
      const eqEl = doc.querySelector('equipment');
      if(eqEl) c.gold = parseInt(eqEl.getAttribute('gold'))||0;
      c.equipment = Array.from(doc.querySelectorAll('equipment item')).map(n=>({index:n.getAttribute('index'), qty:parseInt(n.getAttribute('qty'))||1, name:n.textContent}));
      c.equipmentNotes = textOf(doc,'equipmentNotes');
      const hpEl = doc.querySelector('hp');
      if(hpEl) c.hp = {max: hpEl.getAttribute('max')? parseInt(hpEl.getAttribute('max')):null, current: hpEl.getAttribute('current')? parseInt(hpEl.getAttribute('current')):null, temp: parseInt(hpEl.getAttribute('temp'))||0};
      c.spells.cantrips = Array.from(doc.querySelectorAll('spells cantrip')).map(n=>n.textContent);
      c.spells.known = Array.from(doc.querySelectorAll('spells known')).map(n=>n.textContent);
      c.personality = {
        traits: textOf(doc,'traits'), ideals: textOf(doc,'ideals'),
        bonds: textOf(doc,'bonds'), flaws: textOf(doc,'flaws'),
      };
      c.notes = textOf(doc,'notes');
      state.characters.push(c);
      state.activeId = c.id;
      state.step = 'sheet';
      persistCharacters();
      render();
      showToast('Character imported from XML.');
    }catch(err){
      alert('Could not import this file: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* --------------------------------- boot --------------------------------- */
loadCache();
loadCharacters();
if(state.characters.length) state.activeId = state.characters.sort((a,b)=>b.updatedAt-a.updatedAt)[0].id;
render();
</script>
</body>
</html>
