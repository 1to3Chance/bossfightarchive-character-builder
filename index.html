<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Fight Archive — Character Builder</title>
<meta name="description" content="Build, save, and export D&D 5e character sheets. Nothing leaves your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral+SC:wght@600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#141110;
    --panel:#1c1815;
    --panel-2:#231e1a;
    --raised:#2a241f;
    --line:#3a332b;
    --line-soft:#2a241f;
    --ink:#ece4d6;
    --ink-dim:#b3a996;
    --ink-faint:#7c7263;
    --ember:#c7451d;
    --ember-bright:#e0632f;
    --gold:#b5903a;
    --hp-green:#5c7a4f;
    --danger:#a63a3a;
    --font-display:'Spectral', serif;
    --font-display-sc:'Spectral SC', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
  }
  ::selection{background:var(--ember); color:#fff;}
  a{color:var(--ember-bright);}
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0 0 .4em; color:var(--ink);}
  button{font-family:var(--font-body); cursor:pointer;}
  input,select,textarea{font-family:var(--font-body); color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius); padding:.5em .65em; font-size:.95rem;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--ember);}
  label{display:block; font-size:.72rem; letter-spacing:.02em; color:var(--ink-faint); margin-bottom:.3em; text-transform:none;}
  .field{margin-bottom:1rem;}
  .hint{font-size:.78rem; color:var(--ink-faint); margin-top:.3em;}

  /* ---------- App shell ---------- */
  #app{display:flex; min-height:100vh;}
  .rail{
    width:230px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .rail-brand{
    padding:1.1rem 1.1rem .9rem; border-bottom:1px solid var(--line);
  }
  .rail-brand .mark{font-family:var(--font-display-sc); font-size:.92rem; letter-spacing:.04em; color:var(--ember-bright);}
  .rail-brand .sub{font-size:.72rem; color:var(--ink-faint); margin-top:.2rem;}
  .rail-section{padding:.9rem 1.1rem .3rem; font-size:.68rem; color:var(--ink-faint); letter-spacing:.04em;}
  .char-list{padding:0 .6rem;}
  .char-item{
    display:flex; align-items:center; justify-content:space-between; gap:.4rem;
    padding:.55rem .6rem; border-radius:var(--radius); cursor:pointer; margin-bottom:.15rem;
    border:1px solid transparent;
  }
  .char-item:hover{background:var(--raised);}
  .char-item.active{background:var(--panel-2); border-color:var(--line);}
  .char-item .nm{font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .char-item .meta{font-size:.68rem; color:var(--ink-faint);}
  .char-item .del{opacity:0; background:none; border:none; color:var(--ink-faint); font-size:.9rem; padding:.1rem .3rem;}
  .char-item:hover .del{opacity:1;}
  .char-item .del:hover{color:var(--danger);}
  .new-char-btn{
    margin:.4rem .6rem 1rem; padding:.55rem .6rem; text-align:left;
    background:none; border:1px dashed var(--line); border-radius:var(--radius);
    color:var(--ink-dim); font-size:.85rem; width:calc(100% - 1.2rem);
  }
  .new-char-btn:hover{border-color:var(--ember); color:var(--ember-bright);}

  .steps{padding:0 .6rem; margin-top:auto; border-top:1px solid var(--line); padding-top:.7rem; padding-bottom:.8rem;}
  .step-btn{
    display:flex; align-items:center; gap:.55rem; width:100%; text-align:left;
    background:none; border:none; color:var(--ink-faint); padding:.5rem .6rem;
    border-radius:var(--radius); font-size:.85rem;
  }
  .step-btn .num{
    font-family:var(--font-mono); font-size:.68rem; width:1.3rem; height:1.3rem;
    border:1px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .step-btn.active{color:var(--ink); background:var(--panel-2);}
  .step-btn.active .num{border-color:var(--ember); color:var(--ember-bright);}
  .step-btn.done .num{border-color:var(--gold); color:var(--gold);}
  .step-btn:hover{color:var(--ink);}

  main{flex:1; min-width:0; padding:2.4rem 3rem 5rem; max-width:980px;}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:1.6rem; flex-wrap:wrap; gap:.6rem;}
  .topbar h1{font-size:1.5rem; margin:0;}
  .topbar .status{font-size:.72rem; color:var(--ink-faint); font-family:var(--font-mono);}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:1.6rem 1.8rem; margin-bottom:1.4rem;}
  .panel h2{font-size:1.15rem; border-bottom:1px solid var(--line); padding-bottom:.55rem; margin-bottom:1.1rem;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:1rem 1.4rem;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:1rem 1.4rem;}
  @media (max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  .btn{
    background:var(--ember); color:#fff; border:none; padding:.6rem 1.1rem;
    border-radius:var(--radius); font-size:.88rem; font-weight:600; letter-spacing:.01em;
  }
  .btn:hover{background:var(--ember-bright);}
  .btn:disabled{background:var(--line); color:var(--ink-faint); cursor:not-allowed;}
  .btn.secondary{background:none; border:1px solid var(--line); color:var(--ink-dim);}
  .btn.secondary:hover{border-color:var(--ink-dim); color:var(--ink);}
  .btn.ghost{background:none; border:none; color:var(--ink-faint); padding:.4rem .6rem;}
  .btn.ghost:hover{color:var(--ink);}
  .btn-row{display:flex; gap:.6rem; margin-top:1.5rem; flex-wrap:wrap;}
  .btn-row.split{justify-content:space-between;}

  .card{
    border:1px solid var(--line); border-radius:var(--radius); padding:.9rem 1rem; cursor:pointer;
    background:var(--panel-2); transition:border-color .1s;
  }
  .card:hover{border-color:var(--ink-faint);}
  .card.selected{border-color:var(--ember); background:#241a15;}
  .card h3{font-size:.98rem; margin-bottom:.25rem;}
  .card p{font-size:.8rem; color:var(--ink-dim); margin:0; line-height:1.45;}
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:.7rem;}

  .pill{display:inline-block; font-size:.68rem; padding:.15rem .5rem; border:1px solid var(--line); border-radius:20px; color:var(--ink-faint); margin-right:.3rem;}

  .search{width:100%; margin-bottom:1rem;}

  .loader{display:flex; align-items:center; gap:.6rem; color:var(--ink-faint); font-size:.85rem; padding:1rem 0;}
  .spinner{width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--ember); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .error-box{border:1px solid var(--danger); background:#2a1717; color:#e0b8b8; padding:.9rem 1rem; border-radius:var(--radius); font-size:.85rem; margin-bottom:1rem;}

  .toast{position:fixed; bottom:1.4rem; left:50%; transform:translateX(-50%); background:var(--raised); border:1px solid var(--line); color:var(--ink); padding:.6rem 1.1rem; border-radius:var(--radius); font-size:.85rem; z-index:999; box-shadow:0 6px 24px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  /* ability score boxes */
  .ability-box{border:1px solid var(--line); border-radius:var(--radius); padding:.8rem; text-align:center; background:var(--panel-2);}
  .ability-box .lbl{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.08em; color:var(--ink-faint);}
  .ability-box input{width:70px; text-align:center; font-size:1.3rem; font-family:var(--font-display); margin:.35rem 0 .2rem;}
  .ability-box .mod{font-size:.78rem; color:var(--ink-dim); font-family:var(--font-mono);}
  .pool-readout{font-family:var(--font-mono); font-size:.85rem; color:var(--ink-dim); margin-bottom:1rem;}
  .method-tabs{display:flex; gap:.5rem; margin-bottom:1.2rem;}
  .method-tabs button{flex:1;}

  table.sheet-table{width:100%; border-collapse:collapse; font-size:.85rem;}
  table.sheet-table th, table.sheet-table td{text-align:left; padding:.4rem .3rem; border-bottom:1px solid var(--line-soft);}
  table.sheet-table th{color:var(--ink-faint); font-weight:500; font-size:.72rem;}

  .skill-row{display:flex; align-items:center; gap:.55rem; padding:.35rem 0; border-bottom:1px solid var(--line-soft); font-size:.85rem;}
  .skill-row input[type=checkbox]{accent-color:var(--ember);}
  .skill-row .sname{flex:1;}
  .skill-row .sability{font-family:var(--font-mono); font-size:.68rem; color:var(--ink-faint); width:2.2rem;}
  .skill-row .smod{font-family:var(--font-mono); width:2.6rem; text-align:right;}

  .equip-row{display:flex; align-items:center; gap:.6rem; padding:.4rem 0; border-bottom:1px solid var(--line-soft);}
  .equip-row .en{flex:1; font-size:.87rem;}
  .equip-row input[type=number]{width:56px;}

  .chip-list{display:flex; flex-wrap:wrap; gap:.4rem;}
  .chip{background:var(--panel-2); border:1px solid var(--line); border-radius:20px; padding:.25rem .7rem; font-size:.78rem; display:flex; align-items:center; gap:.4rem;}
  .chip button{background:none; border:none; color:var(--ink-faint); font-size:.85rem; padding:0;}

  /* ---------------- Character sheet (also used for print) ---------------- */
  .sheet{
    background:#f4efe4; color:#231d16; border-radius:2px; padding:2.2rem 2.4rem;
    font-family:var(--font-body);
  }
  .sheet *{color:#231d16;}
  .sheet .sheet-head{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #231d16; padding-bottom:.7rem; margin-bottom:1.2rem;}
  .sheet .sheet-head h2{font-family:var(--font-display); font-size:1.9rem; margin:0;}
  .sheet .sheet-head .sub{font-size:.82rem; color:#5b5142;}
  .sheet-grid{display:grid; grid-template-columns:1.1fr 1fr 1.3fr; gap:1.4rem;}
  @media (max-width:900px){.sheet-grid{grid-template-columns:1fr;}}
  .sheet-block{margin-bottom:1.1rem;}
  .sheet-block h4{font-family:var(--font-display-sc); font-size:.78rem; letter-spacing:.06em; border-bottom:1px solid #cabf9f; padding-bottom:.3rem; margin-bottom:.5rem; color:#5b5142;}
  .statline{display:flex; justify-content:space-between; font-size:.86rem; padding:.15rem 0;}
  .abil-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem;}
  .abil-cell{border:1px solid #cabf9f; border-radius:4px; text-align:center; padding:.45rem 0;}
  .abil-cell .an{font-size:.65rem; letter-spacing:.08em; color:#5b5142;}
  .abil-cell .av{font-family:var(--font-display); font-size:1.15rem;}
  .abil-cell .am{font-size:.7rem; color:#5b5142;}
  .sheet-hp{display:flex; gap:.8rem;}
  .sheet-hp .hb{flex:1; border:1px solid #cabf9f; border-radius:4px; text-align:center; padding:.5rem 0;}
  .sheet-hp .hb .n{font-family:var(--font-display); font-size:1.3rem;}
  .sheet-hp .hb .l{font-size:.65rem; color:#5b5142;}
  .sheet ul{margin:.2rem 0; padding-left:1.1rem; font-size:.85rem;}
  .sheet .prose{font-size:.85rem; white-space:pre-wrap;}

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute; top:0; left:0; width:100%; margin:0; padding:0;}
    .sheet{box-shadow:none; border-radius:0;}
  }
  #print-area{display:none;}

  .empty-state{text-align:center; padding:4rem 1rem; color:var(--ink-faint);}
  .empty-state h2{color:var(--ink-dim);}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--void);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
</style>
</head>
<body>

<div id="app"></div>
<div id="print-area"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   BOSS FIGHT ARCHIVE — CHARACTER BUILDER
   Single-file static app. Integrated SRD + Aurora XML / Custom XML support.
   ========================================================================= */

const CONTENT_BASE = "https://www.dnd5eapi.co/api/2014"; 
const CACHE_KEY = "bfa_content_cache_v1";
const CACHE_TTL_MS = 1000 * 60 * 60 * 12; // 12h
const STORE_KEY = "bfa_characters_v1";
const SOURCES_KEY = "bfa_homebrew_sources_v1"; 
const UPLOADS_KEY = "bfa_uploaded_homebrew_v1";

const FALLBACK_BACKGROUNDS = [
  { index: "acolyte", name: "Acolyte", skills: ["insight", "religion"], source: "Player’s Handbook" },
  { index: "charlatan", name: "Charlatan", skills: ["deception", "sleight-of-hand"], source: "Player’s Handbook" },
  { index: "criminal", name: "Criminal", skills: ["deception", "stealth"], source: "Player’s Handbook" },
  { index: "custom-background", name: "Custom Background", skills: [], source: "Player’s Handbook" },
  { index: "entertainer", name: "Entertainer", skills: ["acrobatics", "performance"], source: "Player’s Handbook" },
  { index: "folk-hero", name: "Folk Hero", skills: ["animal-handling", "survival"], source: "Player’s Handbook" },
  { index: "guild-artisan", name: "Guild Artisan", skills: ["insight", "persuasion"], source: "Player’s Handbook" },
  { index: "hermit", name: "Hermit", skills: ["medicine", "religion"], source: "Player’s Handbook" }
];

function loadHomebrewSources(){
  try{ return JSON.parse(localStorage.getItem(SOURCES_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveHomebrewSources(list){ localStorage.setItem(SOURCES_KEY, JSON.stringify(list)); }

function loadUploadedFiles(){
  try{ return JSON.parse(localStorage.getItem(UPLOADS_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveUploadedFiles(list){
  try{ localStorage.setItem(UPLOADS_KEY, JSON.stringify(list)); return true; }
  catch(e){ showToast("Couldn't save file — storage limit exceeded."); return false; }
}
function addUploadedFile(name, xmlText){
  parseHomebrewXml(xmlText, name);
  const list = loadUploadedFiles();
  const existingIdx = list.findIndex(f=>f.name===name);
  const entry = {name, xml:xmlText, addedAt:Date.now()};
  if(existingIdx>=0) list[existingIdx] = entry; else list.push(entry);
  return saveUploadedFiles(list);
}
function removeUploadedFile(name){
  saveUploadedFiles(loadUploadedFiles().filter(f=>f.name!==name));
}

let homebrewCache = { races:[], classes:[], backgrounds:[], spells:[], equipment:[], loadedAt:0 };

function slug(s){ return (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }

/* Universal XML Parser supporting both Custom <content> schema and Aurora <elements> schema */
function parseHomebrewXml(xmlText, sourceUrl){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('Malformed homebrew XML');
  const out = { races:[], classes:[], backgrounds:[], spells:[], equipment:[] };

  // 1. Check for Aurora Elements format (<elements><element ...>)
  const auroraElements = doc.querySelectorAll('elements > element');
  if(auroraElements.length > 0){
    auroraElements.forEach(el => {
      const type = (el.getAttribute('type') || '').toLowerCase();
      const name = el.getAttribute('name') || 'Unnamed';
      const src = el.getAttribute('source') || sourceUrl;
      const idx = 'hb-' + slug(name);

      if(type === 'background'){
        const skills = [];
        el.querySelectorAll('grant[type="Proficiency"]').forEach(g => {
          const id = g.getAttribute('id') || '';
          if(id.includes('SKILL_')){
            const sk = id.split('SKILL_')[1].toLowerCase().replace(/_/g, '-');
            if(sk) skills.push(sk);
          }
        });
        out.backgrounds.push({
          index: idx, name: name, homebrew: true, source: src, skills: skills,
          description: el.querySelector('description')?.textContent || ''
        });
      } else if(type === 'race') {
        out.races.push({ index: idx, name: name, homebrew: true, source: src, speed: 30, size: 'Medium', ability_bonuses: [], traits: [], languages: [], subraces: [] });
      } else if(type === 'class') {
        out.classes.push({ index: idx, name: name, homebrew: true, source: src, hit_die: 8, saving_throws: [], proficiency_choices: [], spellcasting: false });
      } else if(type === 'spell') {
        out.spells.push({ index: idx, name: name, homebrew: true, source: src, level: 0, school: '', klass: '', description: el.querySelector('description')?.textContent || '' });
      } else if(type === 'equipment' || type === 'item') {
        out.equipment.push({ index: idx, name: name, homebrew: true, source: src, category: '', cost: '' });
      }
    });
    return out;
  }

  // 2. Custom <content> format
  doc.querySelectorAll('content > race').forEach(el=>{
    out.races.push({
      index: 'hb-' + slug(el.getAttribute('name')), name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      speed: parseInt(el.querySelector('speed')?.textContent)||30,
      size: el.querySelector('size')?.textContent || 'Medium',
      ability_bonuses: Array.from(el.querySelectorAll('ability_bonus')).map(b=>({ability_score:{index:b.getAttribute('ability')}, bonus:parseInt(b.getAttribute('value'))})),
      traits: Array.from(el.querySelectorAll('trait')).map(t=>({name:t.getAttribute('name'), description:t.querySelector('description')?.textContent||''})),
      languages: Array.from(el.querySelectorAll('language')).map(l=>({name:l.textContent})),
      subraces: []
    });
  });

  doc.querySelectorAll('content > class').forEach(el=>{
    out.classes.push({
      index: 'hb-' + slug(el.getAttribute('name')), name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      hit_die: parseInt(el.getAttribute('hit_die'))||8,
      saving_throws: Array.from(el.querySelectorAll('saving_throw')).map(s=>({index:s.getAttribute('ability'), name:s.getAttribute('ability').toUpperCase()})),
      proficiency_choices: (()=>{
        const sc = el.querySelector('skill_choice');
        if(!sc) return [];
        return [{ choose: parseInt(sc.getAttribute('count'))||2, from:{ options: Array.from(sc.querySelectorAll('option')).map(o=>({item:{index:'skill-'+o.getAttribute('skill')}})) } }];
      })(),
      spellcasting: !!el.querySelector('spellcasting')
    });
  });

  doc.querySelectorAll('content > background').forEach(el=>{
    out.backgrounds.push({
      index: 'hb-' + slug(el.getAttribute('name')), name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      skills: Array.from(el.querySelectorAll('skill_proficiency')).map(s=>s.getAttribute('skill'))
    });
  });

  doc.querySelectorAll('content > spell').forEach(el=>{
    out.spells.push({
      index: 'hb-' + slug(el.getAttribute('name')), name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      level: parseInt(el.getAttribute('level'))||0,
      school: el.getAttribute('school')||'', klass: el.getAttribute('class')||'',
      description: el.querySelector('description')?.textContent||''
    });
  });

  doc.querySelectorAll('content > equipment').forEach(el=>{
    out.equipment.push({
      index: 'hb-' + slug(el.getAttribute('name')), name: el.getAttribute('name'),
      homebrew:true, source: el.getAttribute('source')||sourceUrl,
      category: el.getAttribute('category')||'', cost: el.querySelector('cost')?.textContent||''
    });
  });

  return out;
}

async function loadAllHomebrew(force){
  const sources = loadHomebrewSources();
  const uploads = loadUploadedFiles();
  if(!sources.length && !uploads.length){ 
    homebrewCache = { races:[], classes:[], backgrounds:[], spells:[], equipment:[], loadedAt:Date.now() }; 
    return homebrewCache; 
  }
  if(!force && Date.now() - homebrewCache.loadedAt < CACHE_TTL_MS && homebrewCache.loadedAt) return homebrewCache;
  const merged = { races:[], classes:[], backgrounds:[], spells:[], equipment:[] };

  for(const file of uploads){
    try{
      const parsed = parseHomebrewXml(file.xml, file.name);
      Object.keys(merged).forEach(k=>merged[k].push(...parsed[k]));
    }catch(err){
      console.warn('Uploaded file failed to parse:', file.name, err);
      state.errors['hb:'+file.name] = err.message;
    }
  }
  for(const url of sources){
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      const parsed = parseHomebrewXml(text, url);
      Object.keys(merged).forEach(k=>merged[k].push(...parsed[k]));
    }catch(err){
      console.warn('Homebrew source failed:', url, err);
      state.errors['hb:'+url] = err.message;
    }
  }
  homebrewCache = { ...merged, loadedAt: Date.now() };
  return homebrewCache;
}

const SKILLS = [
  ["acrobatics","dex"],["animal-handling","wis"],["arcana","int"],["athletics","str"],
  ["deception","cha"],["history","int"],["insight","wis"],["intimidation","cha"],
  ["investigation","int"],["medicine","wis"],["nature","int"],["perception","wis"],
  ["performance","cha"],["persuasion","cha"],["religion","int"],["sleight-of-hand","dex"],
  ["stealth","dex"],["survival","wis"]
];
const ABILS = ["str","dex","con","int","wis","cha"];
const ABIL_NAMES = {str:"Strength",dex:"Dexterity",con:"Constitution",int:"Intelligence",wis:"Wisdom",cha:"Charisma"};

const STEPS = [
  {id:"identity", label:"Identity"},
  {id:"race", label:"Race"},
  {id:"class", label:"Class"},
  {id:"abilities", label:"Ability Scores"},
  {id:"background", label:"Background & Skills"},
  {id:"equipment", label:"Equipment"},
  {id:"spells", label:"Spells"},
  {id:"sheet", label:"Character Sheet"},
];

const state = {
  characters: [],
  activeId: null,
  step: "identity",
  cache: {},
  loading: {},
  errors: {},
  showSettings: false,
};

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadCharacters(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    state.characters = raw ? JSON.parse(raw) : [];
  }catch(e){ state.characters = []; }
}
function persistCharacters(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state.characters));
}
function activeChar(){
  return state.characters.find(c => c.id === state.activeId) || null;
}
function touch(c){ c.updatedAt = Date.now(); persistCharacters(); }

function newCharacter(name){
  return {
    id: uid(),
    name: name || "Unnamed Adventurer",
    createdAt: Date.now(), updatedAt: Date.now(),
    playerName:"", alignment:"", level:1, xp:0,
    raceIndex:null, subraceIndex:null, classIndex:null,
    backgroundIndex:null, backgroundCustom:"",
    abilityMethod:"standard",
    abilityScores:{str:10,dex:10,con:10,int:10,wis:10,cha:10},
    skillProfs:[], languages:[], equipment:[], equipmentNotes:"", gold:0,
    hp:{max:null,current:null,temp:0}, hitDiceUsed:0,
    spells:{cantrips:[],known:[]},
    personality:{traits:"",ideals:"",bonds:"",flaws:""},
    notes:"", inspiration:false
  };
}

function loadCache(){
  try{ state.cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); }
  catch(e){ state.cache = {}; }
}
function saveCache(){ localStorage.setItem(CACHE_KEY, JSON.stringify(state.cache)); }

async function api(path){
  const key = path;
  const entry = state.cache[key];
  if(entry && (Date.now() - entry.t < CACHE_TTL_MS)) return entry.d;
  const res = await fetch(CONTENT_BASE + path);
  if(!res.ok) throw new Error("Content fetch failed: " + path + " (" + res.status + ")");
  const data = await res.json();
  state.cache[key] = {t:Date.now(), d:data};
  saveCache();
  return data;
}

let _listCache = {};
async function apiList(kind){
  if(_listCache[kind]) return _listCache[kind];
  const data = await api("/" + kind);
  _listCache[kind] = data.results || [];
  return _listCache[kind];
}

const USE_SRD_KEY = "bfa_use_srd_v1";
function getUseSrd(){ const v = localStorage.getItem(USE_SRD_KEY); return v===null ? true : v==='1'; }
function setUseSrd(v){ localStorage.setItem(USE_SRD_KEY, v ? '1':'0'); }
function isHomebrewIndex(idx){ return typeof idx === 'string' && idx.startsWith('hb-'); }

async function getRaces(){
  const hb = await loadAllHomebrew();
  const srd = getUseSrd() ? await apiList('races') : [];
  return [...srd, ...hb.races];
}
async function getClasses(){
  const hb = await loadAllHomebrew();
  const srd = getUseSrd() ? await apiList('classes') : [];
  return [...srd, ...hb.classes];
}
async function getBackgrounds(){
  const hb = await loadAllHomebrew();
  let srd = [];
  if(getUseSrd()){ try{ srd = await apiList('backgrounds'); }catch(e){ srd = FALLBACK_BACKGROUNDS; } }
  return [...srd, ...hb.backgrounds];
}
async function getEquipmentList(){
  const hb = await loadAllHomebrew();
  const srd = getUseSrd() ? await apiList('equipment') : [];
  return [...srd, ...hb.equipment];
}
async function getRaceDetail(index, list){
  if(isHomebrewIndex(index)) return (list||(await getRaces())).find(r=>r.index===index) || null;
  return api('/races/'+index);
}
async function getClassDetail(index, list){
  if(isHomebrewIndex(index)) return (list||(await getClasses())).find(cl=>cl.index===index) || null;
  return api('/classes/'+index);
}

function mod(score){ return Math.floor((score-10)/2); }
function fmtMod(n){ return (n>=0?"+":"") + n; }
function profBonus(level){ return Math.ceil(level/4) + 1; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

function effectiveAbilities(c, raceData, subraceData){
  const out = {...c.abilityScores};
  const applyBonuses = (bonuses) => {
    (bonuses||[]).forEach(b=>{
      const key = b.ability_score?.index;
      if(key) out[key] = (out[key]||10) + b.bonus;
    });
  };
  if(raceData) applyBonuses(raceData.ability_bonuses);
  if(subraceData) applyBonuses(subraceData.ability_bonuses);
  return out;
}

const appEl = document.getElementById('app');

function renderCharList(){
  return state.characters.map(ch => `
    <div class="char-item ${ch.id === state.activeId ? 'active' : ''}" data-id="${ch.id}">
      <div>
        <div class="nm">${esc(ch.name)}</div>
        <div class="meta">Lvl ${ch.level}</div>
      </div>
      <button class="del" title="Delete">✕</button>
    </div>
  `).join('');
}

function renderStepNav(){
  return `
    <div class="steps">
      ${STEPS.map((s, i) => `
        <button class="step-btn ${state.step === s.id ? 'active' : ''}" data-step="${s.id}">
          <span class="num">${i+1}</span>
          <span>${s.label}</span>
        </button>
      `).join('')}
    </div>
  `;
}

function renderEmptyState(){
  return `
    <div class="empty-state">
      <h2>No Character Selected</h2>
      <p>Select a character from the left rail or create a new one to begin.</p>
    </div>
  `;
}

function onNewCharacter(){
  const c = newCharacter("New Adventurer");
  state.characters.unshift(c);
  state.activeId = c.id;
  state.step = "identity";
  state.showSettings = false;
  persistCharacters();
  render();
}

function render(){
  const c = activeChar();
  appEl.innerHTML = `
    <div class="rail">
      <div class="rail-brand">
        <div class="mark">BOSS FIGHT ARCHIVE</div>
        <div class="sub">Character Builder</div>
      </div>
      <div class="rail-section">Your characters</div>
      <div class="char-list">${renderCharList()}</div>
      <button class="new-char-btn" id="btn-new-char">+ New character</button>
      ${c && !state.showSettings ? renderStepNav() : ''}
      <div style="padding:.6rem; border-top:1px solid var(--line); margin-top:auto;">
        <button class="btn ghost" id="btn-content-sources" style="width:100%; text-align:left; font-size:.8rem;">⚙ Content Sources</button>
      </div>
    </div>
    <main>${state.showSettings ? '' : (c ? '' : renderEmptyState())}</main>
  `;

  document.getElementById('btn-new-char').addEventListener('click', onNewCharacter);
  document.getElementById('btn-content-sources').addEventListener('click', ()=>{ state.showSettings = true; render(); });

  appEl.querySelectorAll('.char-item').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.del')) return;
      state.activeId = el.dataset.id;
      state.step = "identity";
      state.showSettings = false;
      render();
    });
  });

  appEl.querySelectorAll('.char-item .del').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.closest('.char-item').dataset.id;
      const ch = state.characters.find(x=>x.id===id);
      if(confirm(`Delete "${ch.name}"?`)){
        state.characters = state.characters.filter(x=>x.id!==id);
        persistCharacters();
        if(state.activeId===id) state.activeId = state.characters[0]?.id || null;
        render();
      }
    });
  });

  if(state.showSettings){
    renderSettingsPanel();
  } else if(c) {
    appEl.querySelectorAll('.step-btn').forEach(el=>{
      el.addEventListener('click', ()=>{ state.step = el.dataset.step; render(); });
    });
    renderMain(c);
  }
}

function renderSettingsPanel(){
  const main = document.querySelector('main');
  const sources = loadHomebrewSources();
  const uploads = loadUploadedFiles();
  main.innerHTML = `
    <div class="topbar"><h1>Content Sources</h1></div>
    <div class="panel">
      <h2>Options</h2>
      <div class="field" style="display:flex; align-items:center; gap:.6rem;">
        <input type="checkbox" id="use-srd" ${getUseSrd()?'checked':''} style="width:auto;">
        <label style="margin:0;" for="use-srd">Include D&amp;D 5e SRD content (races, classes, spells, equipment)</label>
      </div>
    </div>
    <div class="panel">
      <h2>Upload XML Content Files</h2>
      <p class="hint" style="margin-bottom:1rem;">Upload XML files (Aurora elements or Boss Fight Archive XML schema). Parsed locally in your browser.</p>
      <input type="file" id="file-upload" accept=".xml" multiple style="margin-bottom:1rem;">
      <div id="upload-list">
        ${uploads.length ? uploads.map(f=>`
          <div class="equip-row">
            <span class="en">${esc(f.name)} <span class="hint">— added ${new Date(f.addedAt).toLocaleDateString()}</span></span>
            <button class="btn ghost upload-del" data-name="${esc(f.name)}">✕</button>
          </div>
        `).join('') : '<p class="hint">No files uploaded yet.</p>'}
      </div>
    </div>
    <div class="panel">
      <h2>GitHub XML URLs</h2>
      <div class="field">
        <label>Raw Github URLs (one per line)</label>
        <textarea id="sources-input" rows="4" style="width:100%;">${sources.join('\n')}</textarea>
      </div>
      <div class="btn-row">
        <button class="btn" id="save-sources-btn">Save Sources</button>
        <button class="btn secondary" id="close-settings-btn">Back to Builder</button>
      </div>
    </div>
  `;

  document.getElementById('use-srd').addEventListener('change', (e)=>{ setUseSrd(e.target.checked); });
  document.getElementById('file-upload').addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files);
    for(const file of files){
      const text = await file.text();
      addUploadedFile(file.name, text);
    }
    await loadAllHomebrew(true);
    renderSettingsPanel();
  });
  main.querySelectorAll('.upload-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      removeUploadedFile(btn.dataset.name);
      await loadAllHomebrew(true);
      renderSettingsPanel();
    });
  });
  document.getElementById('save-sources-btn').addEventListener('click', async ()=>{
    const raw = document.getElementById('sources-input').value;
    const list = raw.split('\n').map(s=>s.trim()).filter(Boolean);
    saveHomebrewSources(list);
    await loadAllHomebrew(true);
    showToast('Sources saved and loaded');
  });
  document.getElementById('close-settings-btn').addEventListener('click', ()=>{ state.showSettings = false; render(); });
}

function renderMain(c){
  const main = document.querySelector('main');
  if(state.step === 'identity') renderIdentityStep(main, c);
  else if(state.step === 'race') renderRaceStep(main, c);
  else if(state.step === 'class') renderClassStep(main, c);
  else if(state.step === 'abilities') renderAbilitiesStep(main, c);
  else if(state.step === 'background') renderBackgroundStep(main, c);
  else if(state.step === 'equipment') renderEquipmentStep(main, c);
  else if(state.step === 'spells') renderSpellsStep(main, c);
  else if(state.step === 'sheet') renderSheetStep(main, c);
}

function renderIdentityStep(main, c){
  main.innerHTML = `
    <div class="topbar"><h1>Character Identity</h1></div>
    <div class="panel grid-2">
      <div class="field">
        <label>Character Name</label>
        <input type="text" id="id-name" value="${esc(c.name)}">
      </div>
      <div class="field">
        <label>Player Name</label>
        <input type="text" id="id-player" value="${esc(c.playerName)}">
      </div>
      <div class="field">
        <label>Alignment</label>
        <input type="text" id="id-align" value="${esc(c.alignment)}" placeholder="e.g. Neutral Good">
      </div>
      <div class="field">
        <label>Level</label>
        <input type="number" id="id-level" value="${c.level}" min="1" max="20">
      </div>
    </div>
    <div class="panel">
      <h2>Personality</h2>
      <div class="grid-2">
        <div class="field"><label>Traits</label><textarea id="id-traits" rows="3">${esc(c.personality.traits)}</textarea></div>
        <div class="field"><label>Ideals</label><textarea id="id-ideals" rows="3">${esc(c.personality.ideals)}</textarea></div>
        <div class="field"><label>Bonds</label><textarea id="id-bonds" rows="3">${esc(c.personality.bonds)}</textarea></div>
        <div class="field"><label>Flaws</label><textarea id="id-flaws" rows="3">${esc(c.personality.flaws)}</textarea></div>
      </div>
    </div>
  `;

  const bind = (id, prop) => {
    document.getElementById(id).addEventListener('input', (e)=>{
      if(prop.includes('.')){
        const [a,b] = prop.split('.');
        c[a][b] = e.target.value;
      } else {
        c[prop] = e.target.type==='number' ? parseInt(e.target.value)||1 : e.target.value;
      }
      touch(c);
    });
  };
  bind('id-name', 'name'); bind('id-player', 'playerName'); bind('id-align', 'alignment');
  bind('id-level', 'level'); bind('id-traits', 'personality.traits'); bind('id-ideals', 'personality.ideals');
  bind('id-bonds', 'personality.bonds'); bind('id-flaws', 'personality.flaws');
}

async function renderRaceStep(main, c){
  main.innerHTML = `<div class="loader"><div class="spinner"></div> Loading races...</div>`;
  const races = await getRaces();
  main.innerHTML = `
    <div class="topbar"><h1>Select Race</h1></div>
    <div class="card-grid">
      ${races.map(r=>`
        <div class="card ${c.raceIndex === r.index ? 'selected' : ''}" data-idx="${r.index}">
          <h3>${esc(r.name)} ${r.homebrew ? '<span class="pill">Homebrew</span>':''}</h3>
        </div>
      `).join('')}
    </div>
  `;
  main.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      c.raceIndex = card.dataset.idx;
      touch(c); render();
    });
  });
}

async function renderClassStep(main, c){
  main.innerHTML = `<div class="loader"><div class="spinner"></div> Loading classes...</div>`;
  const classes = await getClasses();
  main.innerHTML = `
    <div class="topbar"><h1>Select Class</h1></div>
    <div class="card-grid">
      ${classes.map(cl=>`
        <div class="card ${c.classIndex === cl.index ? 'selected' : ''}" data-idx="${cl.index}">
          <h3>${esc(cl.name)} ${cl.homebrew ? '<span class="pill">Homebrew</span>':''}</h3>
        </div>
      `).join('')}
    </div>
  `;
  main.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      c.classIndex = card.dataset.idx;
      touch(c); render();
    });
  });
}

function renderAbilitiesStep(main, c){
  main.innerHTML = `
    <div class="topbar"><h1>Ability Scores</h1></div>
    <div class="panel">
      <div class="grid-3">
        ${ABILS.map(a=>`
          <div class="ability-box">
            <div class="lbl">${a.toUpperCase()}</div>
            <input type="number" class="abil-inp" data-abil="${a}" value="${c.abilityScores[a]}" min="3" max="20">
            <div class="mod">${fmtMod(mod(c.abilityScores[a]))}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  main.querySelectorAll('.abil-inp').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      c.abilityScores[inp.dataset.abil] = parseInt(e.target.value)||10;
      touch(c);
      inp.nextElementSibling.textContent = fmtMod(mod(c.abilityScores[inp.dataset.abil]));
    });
  });
}

async function renderBackgroundStep(main, c){
  main.innerHTML = `<div class="loader"><div class="spinner"></div> Loading backgrounds...</div>`;
  const backgrounds = await getBackgrounds();
  main.innerHTML = `
    <div class="topbar"><h1>Background &amp; Skills</h1></div>
    <div class="panel">
      <h2>Background</h2>
      <div class="card-grid" style="margin-bottom:1rem;">
        ${backgrounds.map(b=>`
          <div class="card ${c.backgroundIndex === b.index ? 'selected':''}" data-idx="${b.index}">
            <h3>${esc(b.name)}</h3>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="panel">
      <h2>Skill Proficiencies</h2>
      <div class="grid-2">
        ${SKILLS.map(([sname, sabil])=>`
          <div class="skill-row">
            <input type="checkbox" class="skill-check" data-skill="${sname}" ${c.skillProfs.includes(sname)?'checked':''}>
            <span class="sname">${sname.replace(/-/g,' ')}</span>
            <span class="sability">${sabil.toUpperCase()}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  main.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      c.backgroundIndex = card.dataset.idx;
      const bg = backgrounds.find(b=>b.index===c.backgroundIndex);
      if(bg && bg.skills) c.skillProfs = Array.from(new Set([...c.skillProfs, ...bg.skills]));
      touch(c); render();
    });
  });

  main.querySelectorAll('.skill-check').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const sk = chk.dataset.skill;
      if(chk.checked) c.skillProfs.push(sk);
      else c.skillProfs = c.skillProfs.filter(s=>s!==sk);
      touch(c);
    });
  });
}

function renderEquipmentStep(main, c){
  main.innerHTML = `
    <div class="topbar"><h1>Equipment</h1></div>
    <div class="panel">
      <div class="field">
        <label>Equipment &amp; Inventory Notes</label>
        <textarea id="equip-notes" rows="8" style="width:100%;">${esc(c.equipmentNotes)}</textarea>
      </div>
      <div class="field">
        <label>Gold Pieces (GP)</label>
        <input type="number" id="equip-gold" value="${c.gold||0}">
      </div>
    </div>
  `;
  document.getElementById('equip-notes').addEventListener('input', (e)=>{ c.equipmentNotes = e.target.value; touch(c); });
  document.getElementById('equip-gold').addEventListener('input', (e)=>{ c.gold = parseInt(e.target.value)||0; touch(c); });
}

function renderSpellsStep(main, c){
  main.innerHTML = `
    <div class="topbar"><h1>Spells</h1></div>
    <div class="panel">
      <p class="hint">Spell management is available for spellcasting classes.</p>
      <div class="field">
        <label>Spellcasting Notes &amp; Known Spells</label>
        <textarea id="spell-notes" rows="8" style="width:100%;">${esc(c.notes)}</textarea>
      </div>
    </div>
  `;
  document.getElementById('spell-notes').addEventListener('input', (e)=>{ c.notes = e.target.value; touch(c); });
}

function renderSheetStep(main, c){
  const pb = profBonus(c.level);
  main.innerHTML = `
    <div class="topbar">
      <h1>Character Sheet</h1>
      <button class="btn" id="print-btn">Print Sheet</button>
    </div>
    <div class="sheet" id="sheet-content">
      <div class="sheet-head">
        <div>
          <h2>${esc(c.name)}</h2>
          <div class="sub">Level ${c.level} | ${esc(c.alignment || 'Unaligned')}</div>
        </div>
        <div style="text-align:right;">
          <div class="sub">Proficiency Bonus: +${pb}</div>
        </div>
      </div>
      <div class="sheet-grid">
        <div class="sheet-block">
          <h4>Ability Scores</h4>
          <div class="abil-grid">
            ${ABILS.map(a=>`
              <div class="abil-cell">
                <div class="an">${a.toUpperCase()}</div>
                <div class="av">${c.abilityScores[a]}</div>
                <div class="am">${fmtMod(mod(c.abilityScores[a]))}</div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="sheet-block">
          <h4>Skills</h4>
          ${SKILLS.map(([sname, sabil])=>{
            const isProf = c.skillProfs.includes(sname);
            const m = mod(c.abilityScores[sabil]) + (isProf ? pb : 0);
            return `<div class="statline"><span>${isProf?'●':'○'} ${sname.replace(/-/g,' ')}</span><span>${fmtMod(m)}</span></div>`;
          }).join('')}
        </div>
        <div class="sheet-block">
          <h4>Equipment &amp; Notes</h4>
          <div class="prose">${esc(c.equipmentNotes || 'No equipment listed.')}</div>
          <p><strong>Gold:</strong> ${c.gold||0} gp</p>
          <h4>Personality &amp; Backstory</h4>
          <p><strong>Traits:</strong> ${esc(c.personality.traits)}</p>
          <p><strong>Ideals:</strong> ${esc(c.personality.ideals)}</p>
          <p><strong>Bonds:</strong> ${esc(c.personality.bonds)}</p>
          <p><strong>Flaws:</strong> ${esc(c.personality.flaws)}</p>
        </div>
      </div>
    </div>
  `;

  document.getElementById('print-btn').addEventListener('click', ()=>{
    document.getElementById('print-area').innerHTML = document.getElementById('sheet-content').outerHTML;
    window.print();
  });
}

// Initial Kickoff
loadCache();
loadCharacters();
if(!state.characters.length){
  state.characters.push(newCharacter("Sample Hero"));
}
state.activeId = state.characters[0].id;
loadAllHomebrew().then(() => render());

</script>

</html>
